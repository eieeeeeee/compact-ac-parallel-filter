name: RC18 R2.3.1C Ngspice Validation
on:
  push:
    branches:
      - rc18-r2-3-1c-native-gate
    paths:
      - '.github/workflows/rc18-r231c-ngspice.yml'
  workflow_dispatch:
jobs:
  ngspice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ngspice
        run: |
          sudo apt-get update
          sudo apt-get install -y ngspice
          ngspice --version | tee simulations/rc18-r231c/NGSPICE_VERSION.txt
      - name: Run v2 cases and retain logs
        shell: bash
        run: |
          set +e
          for f in branch_step_v2 branch_ramp35_v2 branch_ramp50_v2 pwm_steady_v2; do
            ngspice -b -o simulations/rc18-r231c/$f.log simulations/rc18-r231c/$f.cir
            echo $? > simulations/rc18-r231c/$f.rc
          done
          set -e
      - name: Summarize
        shell: bash
        run: |
          {
            echo "===== VERSION ====="
            cat simulations/rc18-r231c/NGSPICE_VERSION.txt
            for f in branch_step_v2 branch_ramp35_v2 branch_ramp50_v2 pwm_steady_v2; do
              echo "===== $f RC ====="
              cat simulations/rc18-r231c/$f.rc
              echo "===== $f LOG ====="
              cat simulations/rc18-r231c/$f.log
            done
          } | tee simulations/rc18-r231c/RESULTS_SUMMARY_V2.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc18-r231c-ngspice-results-v2
          path: simulations/rc18-r231c/
          retention-days: 7
