name: RC18 R2.3.1C Ngspice Validation
on:
  push:
    branches:
      - rc18-r2-3-1c-native-gate
    paths:
      - '.github/workflows/rc18-r231c-ngspice.yml'
  workflow_dispatch:
jobs:
  ngspice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ngspice
        run: |
          sudo apt-get update
          sudo apt-get install -y ngspice
          ngspice --version | tee simulations/rc18-r231c/NGSPICE_VERSION.txt
      - name: Run all cases and retain logs
        shell: bash
        run: |
          set +e
          ngspice -b -o simulations/rc18-r231c/branch_step.log simulations/rc18-r231c/branch_step.cir
          echo $? > simulations/rc18-r231c/branch_step.rc
          ngspice -b -o simulations/rc18-r231c/branch_ramp35.log simulations/rc18-r231c/branch_ramp35.cir
          echo $? > simulations/rc18-r231c/branch_ramp35.rc
          ngspice -b -o simulations/rc18-r231c/pwm_nominal.log simulations/rc18-r231c/pwm_nominal.cir
          echo $? > simulations/rc18-r231c/pwm_nominal.rc
          set -e
      - name: Summarize
        shell: bash
        run: |
          {
            echo "===== VERSION ====="
            cat simulations/rc18-r231c/NGSPICE_VERSION.txt
            echo "===== RETURN CODES ====="
            printf "branch_step="; cat simulations/rc18-r231c/branch_step.rc
            printf "branch_ramp35="; cat simulations/rc18-r231c/branch_ramp35.rc
            printf "pwm_nominal="; cat simulations/rc18-r231c/pwm_nominal.rc
            echo "===== BRANCH STEP ====="
            cat simulations/rc18-r231c/branch_step.log
            echo "===== RAMP35 ====="
            cat simulations/rc18-r231c/branch_ramp35.log
            echo "===== PWM ====="
            cat simulations/rc18-r231c/pwm_nominal.log
          } | tee simulations/rc18-r231c/RESULTS_SUMMARY.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc18-r231c-ngspice-results
          path: simulations/rc18-r231c/
          retention-days: 7
