name: KiCad 10 RC18 Rev.B-SI P2.1 Full Route

on:
  push:
    branches:
      - rc18-revb-si-p2-1-functional-layout
    paths:
      - 'ci/p2-1-layout/**'
      - 'ci/p0-pcb/**'
      - 'ci/p2-kicad10/**'
      - '.github/workflows/kicad10-rc18-revb-si-p2-1-full-route.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p21-full-route:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct ERC0 project
        run: |
          set -euxo pipefail
          mkdir -p ci-reports hardware/rc18-revb-si-p21-full
          cat ci/p2-kicad10/p2-package.b64.part* | base64 -d > /tmp/p2.zip
          echo "b3ca981044bb8607d98d2648eb9bfe2903048b8b03bf23c30fff45204a6adf51  /tmp/p2.zip" | sha256sum -c -
          unzip -q -o /tmp/p2.zip -d hardware/rc18-revb-si-p21-full
          python ci/p2-kicad10/fix_erc.py hardware/rc18-revb-si-p21-full/P2_KiCad10_ERC0_Footprint
          chmod -R a+rwX ci-reports hardware/rc18-revb-si-p21-full/P2_KiCad10_ERC0_Footprint

      - name: Pull official KiCad 10.0.6 image
        run: docker pull kicad/kicad:10.0.6

      - name: Build P2.1 protected board and DSN
        id: build
        continue-on-error: true
        run: |
          set -euxo pipefail
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            -w /work/hardware/rc18-revb-si-p21-full/P2_KiCad10_ERC0_Footprint \
            kicad/kicad:10.0.6 \
            bash -lc '
              kicad-cli sch export netlist --format kicadxml -o /work/ci-reports/RC18_RevB_SI.xml RC18_RevB_SI.kicad_sch
              python3 /work/ci/p2-1-layout/generate_p21_placement.py \
                /work/hardware/rc18-revb-si-p21-full/P2_KiCad10_ERC0_Footprint \
                /work/ci-reports/RC18_RevB_SI.xml \
                /work/hardware/rc18-revb-si-p21-full/P2_KiCad10_ERC0_Footprint/RC18_RevB_SI.kicad_pcb
              python3 /work/ci/p2-1-layout/apply_p21_critical.py \
                /work/hardware/rc18-revb-si-p21-full/P2_KiCad10_ERC0_Footprint/RC18_RevB_SI.kicad_pcb \
                /work/hardware/rc18-revb-si-p21-full/P2_KiCad10_ERC0_Footprint/RC18_RevB_SI.kicad_pcb
              python3 /work/ci/p2-1-layout/apply_p21_planes.py \
                /work/hardware/rc18-revb-si-p21-full/P2_KiCad10_ERC0_Footprint/RC18_RevB_SI.kicad_pcb \
                /work/hardware/rc18-revb-si-p21-full/P2_KiCad10_ERC0_Footprint/RC18_RevB_SI.kicad_pcb
              python3 /work/ci/p2-1-layout/apply_p21_control.py \
                /work/hardware/rc18-revb-si-p21-full/P2_KiCad10_ERC0_Footprint/RC18_RevB_SI.kicad_pcb \
                /work/hardware/rc18-revb-si-p21-full/P2_KiCad10_ERC0_Footprint/RC18_RevB_SI.kicad_pcb
              python3 /work/ci/p2-1-layout/apply_p21_analog.py \
                /work/hardware/rc18-revb-si-p21-full/P2_KiCad10_ERC0_Footprint/RC18_RevB_SI.kicad_pcb \
                /work/hardware/rc18-revb-si-p21-full/P2_KiCad10_ERC0_Footprint/RC18_RevB_SI.kicad_pcb
              python3 /work/ci/p2-1-layout/prepare_p21_dsn.py \
                /work/hardware/rc18-revb-si-p21-full/P2_KiCad10_ERC0_Footprint/RC18_RevB_SI.kicad_pcb \
                /work/ci-reports/RC18_RevB_SI_P21.dsn
            '

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Download Freerouting 2.4.1
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 -o /tmp/freerouting.jar \
            https://github.com/freerouting/freerouting/releases/download/v2.4.1/freerouting-2.4.1.jar
          echo "251101c3eeac22d7e7dfcf6796603279e5d1000283eb82d8f093780f7afc6aa9  /tmp/freerouting.jar" | sha256sum -c -

      - name: Route only remaining F.Cu and B.Cu nets
        id: route
        continue-on-error: true
        run: |
          set -euxo pipefail
          mkdir -p /tmp/freerouting
          timeout 1200s java -jar /tmp/freerouting.jar \
            --gui.enabled=false \
            --api_server.enabled=false \
            --user_data_path=/tmp/freerouting \
            --logging.file.enabled=false \
            --logging.console.level=INFO \
            --router.layers.routable=true,false,false,true \
            --router.layers.preferred_direction_horizontal=true,false,false,false \
            --router.copperToEdgeClearanceUm=500 \
            -de "${{ github.workspace }}/ci-reports/RC18_RevB_SI_P21.dsn" \
            -do "${{ github.workspace }}/ci-reports/RC18_RevB_SI_P21.ses" \
            -mp 100 -mt 2 -da 2>&1 | tee ci-reports/FREEROUTING_P21.log
          test -s ci-reports/RC18_RevB_SI_P21.ses

      - name: Import P2.1 SES and refill planes
        id: import
        continue-on-error: true
        run: |
          set -euxo pipefail
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            -w /work/hardware/rc18-revb-si-p21-full/P2_KiCad10_ERC0_Footprint \
            kicad/kicad:10.0.6 \
            python3 /work/ci/p2-1-layout/import_p21_ses.py \
              /work/hardware/rc18-revb-si-p21-full/P2_KiCad10_ERC0_Footprint/RC18_RevB_SI.kicad_pcb \
              /work/ci-reports/RC18_RevB_SI_P21.ses \
              /work/hardware/rc18-revb-si-p21-full/P2_KiCad10_ERC0_Footprint/RC18_RevB_SI.kicad_pcb \
              /work/hardware/rc18-revb-si-p21-full/P2_KiCad10_ERC0_Footprint/RC18_RevB_SI.kicad_pro

      - name: Run pre-clean full DRC
        id: predrc
        continue-on-error: true
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            -w /work/hardware/rc18-revb-si-p21-full/P2_KiCad10_ERC0_Footprint \
            kicad/kicad:10.0.6 \
            kicad-cli pcb drc --severity-all --exit-code-violations \
              --output /work/ci-reports/RC18_P21_PRECLEAN_DRC.rpt \
              RC18_RevB_SI.kicad_pcb

      - name: Remove only KiCad-reported dangling vias
        id: cleanup
        continue-on-error: true
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            -w /work/hardware/rc18-revb-si-p21-full/P2_KiCad10_ERC0_Footprint \
            kicad/kicad:10.0.6 \
            python3 /work/ci/p2-route/cleanup_dangling_vias.py \
              /work/hardware/rc18-revb-si-p21-full/P2_KiCad10_ERC0_Footprint/RC18_RevB_SI.kicad_pcb \
              /work/ci-reports/RC18_P21_PRECLEAN_DRC.rpt

      - name: Refill zones after cleanup
        if: always()
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            -w /work/hardware/rc18-revb-si-p21-full/P2_KiCad10_ERC0_Footprint \
            kicad/kicad:10.0.6 \
            python3 -c 'import pcbnew; p="RC18_RevB_SI.kicad_pcb"; b=pcbnew.LoadBoard(p); b.BuildConnectivity(); pcbnew.ZONE_FILLER(b).Fill(b.Zones()); pcbnew.SaveBoard(p,b)'

      - name: Run final full KiCad DRC
        id: drc
        continue-on-error: true
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            -w /work/hardware/rc18-revb-si-p21-full/P2_KiCad10_ERC0_Footprint \
            kicad/kicad:10.0.6 \
            kicad-cli pcb drc --severity-all --exit-code-violations \
              --output /work/ci-reports/RC18_P21_FULL_DRC.rpt \
              RC18_RevB_SI.kicad_pcb

      - name: Print full-route reports
        if: always()
        run: |
          echo "BUILD: ${{ steps.build.outcome }}"
          echo "ROUTE: ${{ steps.route.outcome }}"
          echo "IMPORT: ${{ steps.import.outcome }}"
          echo "PRECLEAN: ${{ steps.predrc.outcome }}"
          echo "CLEANUP: ${{ steps.cleanup.outcome }}"
          echo "FINAL DRC: ${{ steps.drc.outcome }}"
          test -f ci-reports/RC18_P21_FULL_DRC.rpt && cat ci-reports/RC18_P21_FULL_DRC.rpt || true
          echo "---- Freerouting tail ----"
          test -f ci-reports/FREEROUTING_P21.log && tail -n 160 ci-reports/FREEROUTING_P21.log || true

      - name: Upload P2.1 full-route artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc18-revb-si-p21-full-route
          path: |
            ci-reports/
            hardware/rc18-revb-si-p21-full/P2_KiCad10_ERC0_Footprint/
          if-no-files-found: warn

      - name: Enforce P2.1 full-route pass
        if: always()
        run: |
          test "${{ steps.build.outcome }}" = "success"
          test "${{ steps.route.outcome }}" = "success"
          test "${{ steps.import.outcome }}" = "success"
          test "${{ steps.cleanup.outcome }}" = "success"
          test "${{ steps.drc.outcome }}" = "success"
