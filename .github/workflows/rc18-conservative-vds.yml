name: RC18 conservative VDS sweep
on:
  push:
    branches:
      - rc18-spice-validation-20261010
    paths:
      - '.github/workflows/rc18-conservative-vds.yml'
jobs:
  vds:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install ngspice
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ngspice
      - name: Run loop inductance sweep
        run: |
          set -euxo pipefail
          : > validation/VDS_MEASURES.txt
          for pair in "2n 0.5n" "5n 1.25n" "10n 2.5n"; do
            set -- $pair
            total=$1
            seg=$2
            sed "s/LPSEG_VALUE/$seg/" validation/rc18_conservative_vds_template.cir > validation/vds_$total.cir
            ngspice -b -o validation/vds_$total.log validation/vds_$total.cir
            echo "=== total loop $total ===" | tee -a validation/VDS_MEASURES.txt
            grep -Ei '^(il1_|sw_|vdsh_|vdsl_)' validation/vds_$total.log | tee -a validation/VDS_MEASURES.txt
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc18-conservative-vds
          path: |
            validation/vds_*.log
            validation/VDS_MEASURES.txt
          retention-days: 7
