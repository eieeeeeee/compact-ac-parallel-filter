name: KiCad 10 RC18 Rev.B-SI P2 Full Route

on:
  push:
    branches:
      - rc18-revb-si-p2-full-route
    paths:
      - 'ci/p2-route/**'
      - 'ci/p1-route/**'
      - 'ci/p0-pcb/**'
      - 'ci/p2-kicad10/**'
      - '.github/workflows/kicad10-rc18-revb-si-p2-full-route.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p2-full-route:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct ERC0 project
        run: |
          set -euxo pipefail
          mkdir -p ci-reports hardware/rc18-revb-si-p2-full
          cat ci/p2-kicad10/p2-package.b64.part* | base64 -d > /tmp/p2.zip
          echo "b3ca981044bb8607d98d2648eb9bfe2903048b8b03bf23c30fff45204a6adf51  /tmp/p2.zip" | sha256sum -c -
          unzip -q -o /tmp/p2.zip -d hardware/rc18-revb-si-p2-full
          python ci/p2-kicad10/fix_erc.py hardware/rc18-revb-si-p2-full/P2_KiCad10_ERC0_Footprint
          chmod -R a+rwX ci-reports hardware/rc18-revb-si-p2-full/P2_KiCad10_ERC0_Footprint

      - name: Pull official KiCad 10.0.6 image
        run: docker pull kicad/kicad:10.0.6

      - name: Build frozen P1 and export Specctra DSN
        id: p1
        run: |
          set -euxo pipefail
          docker run --rm             -v "${{ github.workspace }}:/work"             -w /work/hardware/rc18-revb-si-p2-full/P2_KiCad10_ERC0_Footprint             kicad/kicad:10.0.6             bash -lc '
              kicad-cli --version
              kicad-cli sch export netlist --format kicadxml                 -o /work/ci-reports/RC18_RevB_SI.xml RC18_RevB_SI.kicad_sch
              python3 /work/ci/p1-route/generate_p1.py                 /work/hardware/rc18-revb-si-p2-full/P2_KiCad10_ERC0_Footprint                 /work/ci-reports/RC18_RevB_SI.xml                 /work/hardware/rc18-revb-si-p2-full/P2_KiCad10_ERC0_Footprint/RC18_RevB_SI.kicad_pcb
              python3 /work/ci/p2-route/prepare_dsn.py                 /work/hardware/rc18-revb-si-p2-full/P2_KiCad10_ERC0_Footprint/RC18_RevB_SI.kicad_pcb                 /work/ci-reports/RC18_RevB_SI_P2.dsn
            '

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Download Freerouting 2.4.1
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3             -o /tmp/freerouting.jar             https://github.com/freerouting/freerouting/releases/download/v2.4.1/freerouting-2.4.1.jar
          echo "251101c3eeac22d7e7dfcf6796603279e5d1000283eb82d8f093780f7afc6aa9  /tmp/freerouting.jar" | sha256sum -c -

      - name: Autoroute every remaining net
        id: route
        continue-on-error: true
        run: |
          set -euxo pipefail
          mkdir -p /tmp/freerouting
          timeout 1200s java -jar /tmp/freerouting.jar             --gui.enabled=false             --api_server.enabled=false             --user_data_path=/tmp/freerouting             --logging.file.enabled=false             --logging.console.level=INFO             --router.layers.routable=true,true,true,true             --router.layers.preferred_direction_horizontal=true,false,true,false             --router.copperToEdgeClearanceUm=250             -de "${{ github.workspace }}/ci-reports/RC18_RevB_SI_P2.dsn"             -do "${{ github.workspace }}/ci-reports/RC18_RevB_SI_P2.ses"              -mp 80 -mt 2 -da 2>&1 | tee ci-reports/FREEROUTING.log
          test -s ci-reports/RC18_RevB_SI_P2.ses

      - name: Import SES into KiCad and enable full connectivity DRC
        id: import
        continue-on-error: true
        run: |
          set -euxo pipefail
          docker run --rm             -v "${{ github.workspace }}:/work"             -w /work/hardware/rc18-revb-si-p2-full/P2_KiCad10_ERC0_Footprint             kicad/kicad:10.0.6             python3 /work/ci/p2-route/import_ses.py               /work/hardware/rc18-revb-si-p2-full/P2_KiCad10_ERC0_Footprint/RC18_RevB_SI.kicad_pcb               /work/ci-reports/RC18_RevB_SI_P2.ses               /work/hardware/rc18-revb-si-p2-full/P2_KiCad10_ERC0_Footprint/RC18_RevB_SI_FULL_ROUTED.kicad_pcb               /work/hardware/rc18-revb-si-p2-full/P2_KiCad10_ERC0_Footprint/RC18_RevB_SI.kicad_pro

      - name: Run full KiCad 10 DRC
        id: drc
        continue-on-error: true
        run: |
          docker run --rm             -v "${{ github.workspace }}:/work"             -w /work/hardware/rc18-revb-si-p2-full/P2_KiCad10_ERC0_Footprint             kicad/kicad:10.0.6             kicad-cli pcb drc               --severity-all               --exit-code-violations               --output /work/ci-reports/RC18_P2_FULL_DRC.rpt               RC18_RevB_SI_FULL_ROUTED.kicad_pcb

      - name: Print full-route reports
        if: always()
        run: |
          echo "ROUTE outcome: ${{ steps.route.outcome }}"
          echo "IMPORT outcome: ${{ steps.import.outcome }}"
          echo "DRC outcome: ${{ steps.drc.outcome }}"
          test -f ci-reports/RC18_P2_FULL_DRC.rpt && cat ci-reports/RC18_P2_FULL_DRC.rpt || true
          echo "---- Freerouting tail ----"
          test -f ci-reports/FREEROUTING.log && tail -n 120 ci-reports/FREEROUTING.log || true

      - name: Upload P2 full-route artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc18-revb-si-p2-full-route
          path: |
            ci-reports/
            hardware/rc18-revb-si-p2-full/P2_KiCad10_ERC0_Footprint/
          if-no-files-found: warn

      - name: Enforce full-route pass
        if: always()
        run: |
          test "${{ steps.route.outcome }}" = "success"
          test "${{ steps.import.outcome }}" = "success"
          test "${{ steps.drc.outcome }}" = "success"
