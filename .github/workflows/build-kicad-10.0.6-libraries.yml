name: Build KiCad 10.0.6 Standard Libraries

on:
  push:
    branches:
      - rc18-r12-native-gate-20261007
    paths:
      - '.github/workflows/build-kicad-10.0.6-libraries.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Install KiCad 10.0.6 and standard libraries
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:kicad/kicad-10.0-releases
          sudo apt-get update
          apt-cache search '^kicad-' | tee apt-cache-kicad.txt
          sudo apt-get install -y kicad
          sudo apt-get install -y kicad-symbols kicad-footprints kicad-templates
          kicad-cli --version | tee kicad-version.txt
          test "$(kicad-cli --version | awk '{print $1}')" = "10.0.6"
          test -d /usr/share/kicad/symbols
          test -d /usr/share/kicad/footprints
          find /usr/share/kicad/symbols -maxdepth 1 -type f | head
          find /usr/share/kicad/footprints -maxdepth 1 -type d | head

      - name: Package standard libraries
        run: |
          set -euxo pipefail
          mkdir -p bundle/usr/share/kicad
          cp -a /usr/share/kicad/symbols bundle/usr/share/kicad/
          cp -a /usr/share/kicad/footprints bundle/usr/share/kicad/
          [ -d /usr/share/kicad/template ] && cp -a /usr/share/kicad/template bundle/usr/share/kicad/
          tar -C bundle -caf KICAD_10_0_6_STANDARD_LIBS.tar.zst .
          sha256sum KICAD_10_0_6_STANDARD_LIBS.tar.zst > KICAD_10_0_6_STANDARD_LIBS_SHA256.txt
          ls -lh KICAD_10_0_6_STANDARD_LIBS.tar.zst

      - name: Upload standard libraries artifact
        uses: actions/upload-artifact@v4
        with:
          name: kicad-10.0.6-standard-libraries
          path: |
            KICAD_10_0_6_STANDARD_LIBS.tar.zst
            KICAD_10_0_6_STANDARD_LIBS_SHA256.txt
            apt-cache-kicad.txt
            kicad-version.txt
          compression-level: 0
          if-no-files-found: error
