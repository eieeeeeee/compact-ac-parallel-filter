name: RC18 TI model fetch
on:
  push:
    branches:
      - rc18-spice-validation-20261010
    paths:
      - '.github/workflows/rc18-ti-model-fetch.yml'
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch official TI unencrypted models
        run: |
          set -euxo pipefail
          mkdir models
          curl -fL --retry 4 -o models/CSD17381F4.zip https://www.ti.com/lit/zip/SLPM073
          curl -fL --retry 4 -o models/UCC27282.zip https://www.ti.com/lit/zip/SLUM720
          unzip -l models/CSD17381F4.zip | tee models/CSD_LIST.txt
          unzip -l models/UCC27282.zip | tee models/UCC_LIST.txt
          unzip -q models/CSD17381F4.zip -d models/csd
          unzip -q models/UCC27282.zip -d models/ucc
          find models/csd models/ucc -type f -maxdepth 3 -print | sort | tee models/FILES.txt
      - uses: actions/upload-artifact@v4
        with:
          name: rc18-ti-official-spice-models
          path: models/
          retention-days: 7
