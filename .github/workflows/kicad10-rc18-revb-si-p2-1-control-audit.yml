name: KiCad 10 RC18 Rev.B-SI P2.1 Control Audit

on:
  push:
    branches:
      - rc18-revb-si-p2-1-functional-layout
    paths:
      - 'ci/p2-1-layout/**'
      - 'ci/p0-pcb/**'
      - 'ci/p2-kicad10/**'
      - '.github/workflows/kicad10-rc18-revb-si-p2-1-control-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p21-control-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Reconstruct ERC0 project
        run: |
          set -euxo pipefail
          mkdir -p ci-reports hardware/rc18-revb-si-p21-control
          cat ci/p2-kicad10/p2-package.b64.part* | base64 -d > /tmp/p2.zip
          echo "b3ca981044bb8607d98d2648eb9bfe2903048b8b03bf23c30fff45204a6adf51  /tmp/p2.zip" | sha256sum -c -
          unzip -q -o /tmp/p2.zip -d hardware/rc18-revb-si-p21-control
          python ci/p2-kicad10/fix_erc.py hardware/rc18-revb-si-p21-control/P2_KiCad10_ERC0_Footprint
          chmod -R a+rwX ci-reports hardware/rc18-revb-si-p21-control/P2_KiCad10_ERC0_Footprint
      - name: Pull official KiCad 10.0.6 image
        run: docker pull kicad/kicad:10.0.6
      - name: Build plane baseline and audit control pads
        run: |
          set -euxo pipefail
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            -w /work/hardware/rc18-revb-si-p21-control/P2_KiCad10_ERC0_Footprint \
            kicad/kicad:10.0.6 \
            bash -lc '
              kicad-cli sch export netlist --format kicadxml -o /work/ci-reports/RC18_RevB_SI.xml RC18_RevB_SI.kicad_sch
              python3 /work/ci/p2-1-layout/generate_p21_placement.py \
                /work/hardware/rc18-revb-si-p21-control/P2_KiCad10_ERC0_Footprint \
                /work/ci-reports/RC18_RevB_SI.xml \
                /work/hardware/rc18-revb-si-p21-control/P2_KiCad10_ERC0_Footprint/RC18_RevB_SI.kicad_pcb
              python3 /work/ci/p2-1-layout/apply_p21_critical.py \
                /work/hardware/rc18-revb-si-p21-control/P2_KiCad10_ERC0_Footprint/RC18_RevB_SI.kicad_pcb \
                /work/hardware/rc18-revb-si-p21-control/P2_KiCad10_ERC0_Footprint/RC18_RevB_SI.kicad_pcb
              python3 /work/ci/p2-1-layout/apply_p21_planes.py \
                /work/hardware/rc18-revb-si-p21-control/P2_KiCad10_ERC0_Footprint/RC18_RevB_SI.kicad_pcb \
                /work/hardware/rc18-revb-si-p21-control/P2_KiCad10_ERC0_Footprint/RC18_RevB_SI.kicad_pcb
              python3 /work/ci/p2-1-layout/audit_p21_control.py \
                /work/hardware/rc18-revb-si-p21-control/P2_KiCad10_ERC0_Footprint/RC18_RevB_SI.kicad_pcb | tee /work/ci-reports/RC18_P21_CONTROL_AUDIT.txt
            '
      - name: Upload audit
        uses: actions/upload-artifact@v4
        with:
          name: rc18-revb-si-p21-control-audit
          path: |
            ci-reports/
            hardware/rc18-revb-si-p21-control/P2_KiCad10_ERC0_Footprint/RC18_RevB_SI.kicad_pcb
