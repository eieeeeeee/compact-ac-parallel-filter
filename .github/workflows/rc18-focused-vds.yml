name: RC18 focused VDS sweep
on:
  push:
    branches: [rc18-r2-3-1c-native-gate]
    paths: ['.github/workflows/rc18-focused-vds.yml']
jobs:
  sim:
    runs-on: ubuntu-latest
    steps:
      - name: Install ngspice
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ngspice
      - name: Focused sweep
        shell: bash
        run: |
          set -u
          for ILOAD in 0.807 1.238; do
            for LTOT in 2 5 10 15; do
              LLEG=$(python3 -c "print(float('${LTOT}')/2)")
              cat > ring.cir <<EOF
          * RC18 focused conservative commutation; Coss=44pF each, total loop L=LTOT
          VBUS pbus 0 13.2
          LP pbus dh ${LLEG}n
          LN gsl 0 ${LLEG}n
          SH dh sw gh 0 SWMOD
          SL sw gsl gl 0 SWMOD
          .model SWMOD SW(Ron=0.117 Roff=1e9 Vt=3 Vh=0.2)
          CHS dh sw 44p
          CLS sw gsl 44p
          DHS sw dh DMOD
          DLS gsl sw DMOD
          .model DMOD D(Is=4.6e-10 N=1.125 Rs=6.44m Tt=1n)
          ILOAD sw 0 DC ${ILOAD}
          VGL gl 0 PWL(0 6.96 40n 6.96 41n 0 129n 0 130n 6.96 180n 6.96)
          VGH gh 0 PWL(0 0 55n 0 56n 6.96 114n 6.96 115n 0 180n 0)
          ELS vdls 0 sw gsl 1
          EHS vdhs 0 dh sw 1
          C605 pbus 0 100n
          C606 pbus 0 1u
          C607 pbus 0 10u
          .options reltol=5e-5 abstol=1e-10 vntol=1e-7 method=gear
          .tran 0.05n 175n 0 0.05n
          .meas tran VDSLSMAX MAX V(vdls) FROM=35n TO=170n
          .meas tran VDSLSMIN MIN V(vdls) FROM=35n TO=170n
          .meas tran VDSHSMAX MAX V(vdhs) FROM=35n TO=170n
          .meas tran VDSHSMIN MIN V(vdhs) FROM=35n TO=170n
          .end
          EOF
              set +e
              ngspice -b -o ring.log ring.cir
              rc=$?
              set -e
              echo "CASE I=${ILOAD}A LTOTAL=${LTOT}nH rc=$rc"
              grep -E 'vdslsmax|vdslsmin|vdshsmax|vdshsmin|timestep too small|singular' ring.log || true
            done
          done
