name: RC18 R1.2 Native Manufacturing Gate

on:
  push:
    branches:
      - rc18-r12-native-gate-20261007
    paths:
      - 'rc18-input-url.txt'
      - 'rc18-input-sha256.txt'
      - '.github/workflows/rc18-r12-native-gate.yml'

jobs:
  native-gate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout isolated gate branch
        uses: actions/checkout@v4

      - name: Install exact KiCad 10.0.6
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:kicad/kicad-10.0-releases
          sudo apt-get update
          sudo apt-get install -y kicad
          test "$(kicad-cli --version | awk '{print $1}')" = "10.0.6"
          kicad-cli --version | tee KICAD_NATIVE_VERSION.txt

      - name: Download exact RC18 R1.2 gate bundle
        if: ${{ hashFiles('rc18-input-url.txt', 'rc18-input-sha256.txt') != '' }}
        run: |
          set -euxo pipefail
          URL="$(cat rc18-input-url.txt)"
          EXPECTED="$(tr -d '[:space:]' < rc18-input-sha256.txt)"
          test -n "$URL"
          test -n "$EXPECTED"
          curl -L --fail --retry 3 --retry-delay 2 "$URL" -o RC18_P21_R1_2_ONECLICK_NATIVE_GATE.zip
          echo "$EXPECTED  RC18_P21_R1_2_ONECLICK_NATIVE_GATE.zip" | sha256sum -c -

      - name: Run Native R1.2 gate
        if: ${{ hashFiles('RC18_P21_R1_2_ONECLICK_NATIVE_GATE.zip') != '' }}
        run: |
          set -euxo pipefail
          mkdir gate
          unzip -q RC18_P21_R1_2_ONECLICK_NATIVE_GATE.zip -d gate
          cd gate/RC18_P21_R1_1_RELEASE
          python3 run_r1_2_native_gate.py

      - name: Collect Native evidence
        if: always()
        run: |
          set -euxo pipefail
          mkdir -p collected
          cp -f KICAD_NATIVE_VERSION.txt collected/ 2>/dev/null || true
          cp -rf gate/RC18_P21_R1_1_RELEASE/R1_2_NATIVE_RESULTS collected/ 2>/dev/null || true
          cp -f gate/RC18_P21_MANUFACTURING_MASTER_R1_2.zip collected/ 2>/dev/null || true
          cp -f gate/RC18_P21_MANUFACTURING_MASTER_R1_2_SHA256.txt collected/ 2>/dev/null || true
          find collected -maxdepth 3 -type f -print

      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc18-r12-native-gate-evidence
          path: collected/
          if-no-files-found: error
