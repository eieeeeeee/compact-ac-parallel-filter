name: RC18 ngspice cross-check
on:
  push:
    branches:
      - rc18-r2-3-1c-native-gate
    paths:
      - '.github/workflows/rc18-ngspice-crosscheck.yml'
jobs:
  sim:
    runs-on: ubuntu-latest
    steps:
      - name: Install ngspice
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ngspice
          ngspice --version
      - name: Run branch inrush SPICE
        shell: bash
        run: |
          cat > inrush.cir <<'EOF'
          * RC18 branch-inrush averaged power-stage cross-check
          VAVG src 0 DC 6
          Rl1 src a 0.04
          L1 a n1 0.82u
          C1 n1 0 150n ic=6
          Rl2 n1 b 0.027
          L2 b n2 0.47u
          C2 n2 0 100n ic=6
          Rl3 n2 c 0.037
          L3 c n3 0.68u
          C3 n3 0 82n ic=6
          Cinj n3 nx 1u ic=0
          R301 nx r1 4.7
          VSENSE r1 r2 0
          R302 r2 line 0.426
          Rline line 0 5
          .tran 0.5n 60u uic
          .meas tran IBRMAX MAX I(VSENSE)
          .meas tran IL1MAX MAX I(L1)
          .meas tran IL2MAX MAX I(L2)
          .meas tran IL3MAX MAX I(L3)
          .meas tran V3MIN MIN V(n3)
          .meas tran V3MAX MAX V(n3)
          .end
          EOF
          ngspice -b -o inrush.log inrush.cir
          cat inrush.log
      - name: Run clean PWM steady-state SPICE
        shell: bash
        run: |
          cat > pwm.cir <<'EOF'
          * RC18 worst-LC carrier steady-state; C301 precharged to remove startup transient
          .param T=343.75n
          .param TR=2n
          .param PW=169.875n
          VPWM src 0 PULSE(0 12 0 {TR} {TR} {PW} {T})
          L1 src l1a 0.656u IC=0
          RL1 l1a n1 0.032
          VC1 n1 c1t 0
          C1 c1t 0 127.5n IC=6
          L2 n1 l2a 0.376u IC=0
          RL2 l2a n2 0.0216
          VC2 n2 c2t 0
          C2 c2t 0 85n IC=6
          L3 n2 l3a 0.544u IC=0
          RL3 l3a n3 0.0296
          VC3 n3 c3t 0
          C3 c3t 0 69.7n IC=6
          C301 n3 ci 1.05u IC=6
          R301 ci rsh 4.7
          VSENSE rsh rsh2 0
          R302 rsh2 line 0.426
          RLINE line 0 5
          CPAR src line 7.5p IC=0
          .tran 0.2n 100u 0 0.5n uic
          .meas tran IL1RMS RMS I(L1) FROM=80u TO=100u
          .meas tran IC1RMS RMS I(VC1) FROM=80u TO=100u
          .meas tran IL2RMS RMS I(L2) FROM=80u TO=100u
          .meas tran IC2RMS RMS I(VC2) FROM=80u TO=100u
          .meas tran IL3RMS RMS I(L3) FROM=80u TO=100u
          .meas tran IC3RMS RMS I(VC3) FROM=80u TO=100u
          .meas tran IINJRMS RMS I(VSENSE) FROM=80u TO=100u
          .meas tran VLINERMS RMS V(line) FROM=80u TO=100u
          .meas tran IL1MAX MAX I(L1) FROM=80u TO=100u
          .meas tran IL1MIN MIN I(L1) FROM=80u TO=100u
          .meas tran V3AVG AVG V(n3) FROM=80u TO=100u
          .end
          EOF
          ngspice -b -o pwm.log pwm.cir
          cat pwm.log
