name: RC18-Lite Rev26 Official KiCad DRC
on:
  push:
    branches:
      - rc18-lite-rev26-native-drc-20261022
    paths:
      - 'rev26_native_drc/**'
      - '.github/workflows/rc18-lite-rev26-official-drc.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-drc:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install official KiCad 10 CLI
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends software-properties-common
          sudo add-apt-repository -y ppa:kicad/kicad-10.0-releases
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends kicad
          kicad-cli version
      - name: Restore corrected PCB plus footprint library and verify SHA256
        run: |
          python3 - <<'PY'
          import base64, lzma, hashlib, pathlib, io, tarfile
          wd=pathlib.Path('rev26_native_drc')
          src=wd/'RC18_Lite_Rev26_DRCFIX_bundle.tar.xz.b64'
          raw=lzma.decompress(base64.b64decode(src.read_text().strip()))
          with tarfile.open(fileobj=io.BytesIO(raw)) as archive:
              archive.extractall(wd, filter='data')
          expected='710af374fd54fdae40df21c435d10b9e4e489b096224a8441e405cb257613bda'
          p=wd/'RC18_Lite_Rev26_ROUTED_DRAFT.kicad_pcb'
          got=hashlib.sha256(p.read_bytes()).hexdigest()
          print('Corrected PCB SHA256:', got)
          if got!=expected: raise SystemExit('Input SHA256 mismatch')
          print('Installed custom footprints:',len(list((wd/'RC18_R26.pretty').glob('*.kicad_mod'))))
          if len(list((wd/'RC18_R26.pretty').glob('*.kicad_mod')))!=12: raise SystemExit('Missing custom footprint files')
          PY
      - name: Run KiCad official PCB DRC
        shell: bash
        run: |
          set +e
          kicad-cli pcb drc --format json --severity-all --exit-code-violations \
            -o rev26_native_drc/RC18_Lite_Rev26_OFFICIAL_DRC.json \
            rev26_native_drc/RC18_Lite_Rev26_ROUTED_DRAFT.kicad_pcb \
            2>&1 | tee rev26_native_drc/kicad_drc_console.log
          result=${PIPESTATUS[0]}
          echo "KiCad CLI DRC exit code: $result"
          echo "$result" > rev26_native_drc/kicad_drc_exit_code.txt
          exit "$result"
      - name: Upload official DRC evidence even if violations exist
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc18-lite-rev26-official-kicad-drc-corrected
          path: |
            rev26_native_drc/*.json
            rev26_native_drc/*.txt
            rev26_native_drc/*.log
          if-no-files-found: warn
