name: KiCad 9 Rev.D-G v1.2 Full Semantic ERC

on:
  push:
    branches:
      - rev-d-g-v1.2
    paths:
      - 'hardware/rev-d-g-v1.2/**'
      - '.github/workflows/kicad9-revdg.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-semantic-erc:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare reports
        run: |
          mkdir -p ci-reports
          chmod 777 ci-reports

      - name: Generate full native KiCad 9 schematic
        run: |
          cd hardware/rev-d-g-v1.2
          python3 generate_semantic_schematic.py
          python3 - <<'PY'
          import json, uuid
          src="../rev-c-active-shunt/RevC_Active_Controller_v0.3.1.kicad_pro"
          with open(src,encoding="utf-8") as f:
              p=json.load(f)
          root=str(uuid.uuid5(uuid.UUID("d3791df4-8b62-4ae1-8e92-0f3854a17eb6"),"root"))
          p["boards"]=[]
          p["meta"]["filename"]="RevD_G_v1_2_FULL.kicad_pro"
          p["sheets"]=[[root,"Root"]]
          p["erc"]["erc_exclusions"]=[]
          # Full semantic ERC: do not suppress symbol, grid, drive, or connection checks.
          for k in list(p["erc"]["rule_severities"]):
              if p["erc"]["rule_severities"][k]=="ignore":
                  p["erc"]["rule_severities"][k]="warning"
          p["erc"]["rule_severities"]["lib_symbol_issues"]="warning"
          p["erc"]["rule_severities"]["endpoint_off_grid"]="error"
          if "net_settings" in p:
              p["net_settings"]["netclass_patterns"]=[]
          with open("RevD_G_v1_2_FULL.kicad_pro","w",encoding="utf-8") as f:
              json.dump(p,f,indent=2)
          PY
          cat SEMANTIC_STATIC_CHECK.txt

      - name: Pull official KiCad 9 image
        run: docker pull kicad/kicad:9.0

      - name: KiCad version
        run: docker run --rm kicad/kicad:9.0 kicad-cli --version

      - name: Run official full semantic ERC
        id: erc
        continue-on-error: true
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            -w /work/hardware/rev-d-g-v1.2 \
            kicad/kicad:9.0 \
            kicad-cli sch erc \
              --severity-all \
              --exit-code-violations \
              --output /work/ci-reports/revdg-v12-full-erc.rpt \
              RevD_G_v1_2_FULL.kicad_sch

      - name: Print full ERC report
        if: always()
        run: |
          echo "===== FULL SEMANTIC ERC ====="
          test -f ci-reports/revdg-v12-full-erc.rpt && cat ci-reports/revdg-v12-full-erc.rpt || true
          echo "ERC outcome: ${{ steps.erc.outcome }}"

      - name: Upload formal schematic and ERC report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: revd-g-v12-full-semantic-erc
          path: |
            ci-reports/
            hardware/rev-d-g-v1.2/RevD_G_v1_2_FULL.kicad_sch
            hardware/rev-d-g-v1.2/RevD_G_v1_2_FULL.kicad_pro
            hardware/rev-d-g-v1.2/RevDG_Semantic.kicad_sym
            hardware/rev-d-g-v1.2/sym-lib-table
            hardware/rev-d-g-v1.2/fp-lib-table
            hardware/rev-d-g-v1.2/generate_semantic_schematic.py
            hardware/rev-d-g-v1.2/FOOTPRINT_PENDING_v1.2.csv
            hardware/rev-d-g-v1.2/NETLIST_v1.2.csv
            hardware/rev-d-g-v1.2/BOM_v1.2_FULL.csv
            hardware/rev-d-g-v1.2/NC_PINS_v1.2_FULL.csv
            hardware/rev-d-g-v1.2/PINMAP_v1.2_FULL.csv
            hardware/rev-d-g-v1.2/SEMANTIC_STATIC_CHECK.txt
          if-no-files-found: warn

      - name: Enforce full semantic ERC pass
        if: always()
        run: test "${{ steps.erc.outcome }}" = "success"
