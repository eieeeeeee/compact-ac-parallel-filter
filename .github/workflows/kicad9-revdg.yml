name: KiCad 9 Rev.D-G v1.2 ERC

on:
  push:
    branches:
      - rev-d-g-v1.2
    paths:
      - 'hardware/rev-d-g-v1.2/**'
      - '.github/workflows/kicad9-revdg.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  erc:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare report directory
        run: |
          mkdir -p ci-reports
          chmod 777 ci-reports

      - name: Generate zero-length-pin ERC carrier from authoritative netlist
        run: |
          cd hardware/rev-d-g-v1.2
          python3 - <<'PY'
          import csv

          pin_net = {}
          with open("NETLIST_v1.2.csv", encoding="utf-8-sig") as f:
              rd = csv.reader(f)
              next(rd)
              for row in rd:
                  net = row[0].strip()
                  for pin in row[1:]:
                      pin = pin.strip()
                      if not pin:
                          continue
                      if pin in pin_net and pin_net[pin] != net:
                          raise SystemExit(f"Pin {pin} appears on both {pin_net[pin]} and {net}")
                      pin_net[pin] = net

          # One zero-length passive pin per authoritative assigned pin.
          # Using one-pin symbols eliminates symbol-transform ambiguity in the ERC carrier.
          lib = [
              "EESchema-LIBRARY Version 2.4",
              "#encoding utf-8",
              "#",
              "# NETPIN",
              "#",
              "DEF NETPIN X 0 40 Y Y 1 F N",
              'F0 "X" 0 160 40 H V C CNN',
              'F1 "NETPIN" 0 -160 35 H V C CNN',
              "DRAW",
              "S -100 100 100 -100 0 1 8 f",
              "X P 1 -100 0 0 R 35 35 1 1 P",
              "ENDDRAW",
              "ENDDEF",
              "#",
              "#End Library",
          ]
          open("RevD_G_v1_2_ERC-cache.lib","w",encoding="utf-8").write("\n".join(lib)+"\n")

          sch = [
              "EESchema Schematic File Version 4",
              "LIBS:RevD_G_v1_2_ERC-cache",
              "EELAYER 29 0",
              "EELAYER END",
              "$Descr A0 46811 33110",
              "Sheet 1 1",
              'Title "Rev.D-G v1.2 Authoritative Netlist ERC Carrier"',
              'Date "2026-09-22"',
              'Rev "v1.2-ERC2"',
              'Comp "LOW-VOLTAGE connectivity carrier"',
              'Comment1 "247 assigned pins generated directly from NETLIST_v1.2.csv"',
              'Comment2 "NOT FOR DIRECT AC100V CONNECTION"',
              "$EndDescr",
          ]

          cols = 8
          x0, y0 = 2500, 1500
          xstep, ystep = 5200, 850

          for i,(actual_pin,net) in enumerate(sorted(pin_net.items())):
              col=i%cols
              row=i//cols
              x=x0+col*xstep
              y=y0+row*ystep
              ref=f"X{i+1}"
              uid=0x20000000+i
              sch += [
                  "$Comp",
                  f"L NETPIN {ref}",
                  "U 1 1 %08X"%uid,
                  f"P {x} {y}",
                  f'F 0 "{ref}" H {x} {y-180} 35  0001 C CNN',
                  f'F 1 "{actual_pin}" H {x+150} {y+180} 32  0000 C CNN',
                  f"\t1    {x} {y}",
                  "\t1    0    0    -1",
                  "$EndComp",
                  # zero-length pin is at x-100,y; place net label exactly there
                  f"Text Label {x-100} {y} 0    30   ~ 0",
                  net,
              ]

          sch += [
              "Text Notes 1200 32000 0    100  ~ 20",
              "GENERATED DIRECTLY FROM NETLIST_v1.2.csv — LOW-VOLTAGE CONNECTIVITY ERC CARRIER ONLY.",
              "$EndSCHEMATC",
          ]
          open("RevD_G_v1_2_ERC.sch","w",encoding="utf-8").write("\n".join(sch)+"\n")
          print(f"Generated assigned_pins={len(pin_net)}")
          PY

      - name: Pull official KiCad 9 image
        run: docker pull kicad/kicad:9.0

      - name: KiCad version
        run: docker run --rm kicad/kicad:9.0 kicad-cli --version

      - name: Run official KiCad schematic ERC on authoritative carrier
        id: erc
        continue-on-error: true
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            -w /work/hardware/rev-d-g-v1.2 \
            kicad/kicad:9.0 \
            kicad-cli sch erc \
              --severity-all \
              --exit-code-violations \
              --output /work/ci-reports/revdg-v12-erc.rpt \
              RevD_G_v1_2_ERC.sch

      - name: Print ERC report
        if: always()
        run: |
          echo "===== ERC ====="
          test -f ci-reports/revdg-v12-erc.rpt && cat ci-reports/revdg-v12-erc.rpt || true
          echo "ERC outcome: ${{ steps.erc.outcome }}"

      - name: Upload ERC report and carrier
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: revd-g-v12-kicad9-erc
          path: |
            ci-reports/
            hardware/rev-d-g-v1.2/RevD_G_v1_2_ERC.sch
            hardware/rev-d-g-v1.2/RevD_G_v1_2_ERC-cache.lib
          if-no-files-found: warn

      - name: Enforce ERC pass
        if: always()
        run: test "${{ steps.erc.outcome }}" = "success"
