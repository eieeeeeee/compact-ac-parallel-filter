name: RC18-Lite Rev27 Official KiCad 10 DRC
on:
  push:
    branches:
      - rc18-lite-rev26-native-drc-20261022
    paths:
      - 'rev27_native_drc/**'
      - '.github/workflows/rc18-lite-rev27-official-drc.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-drc:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install KiCad 10 native CLI
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends software-properties-common
          sudo add-apt-repository -y ppa:kicad/kicad-10.0-releases
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends kicad
          kicad-cli version
      - name: Restore routed PCB and local footprint library with hash verification
        run: |
          python3 - <<'PY'
          import base64,hashlib,io,tarfile,pathlib
          src=pathlib.Path('rev27_native_drc/rc18_rev27_input.tar.xz.b64')
          data=base64.b64decode(src.read_text().strip())
          expected='f45bb8dae61b81673d7c0ca2c1694d1ce813789fd33aa1298ee4229953c2a880'
          got=hashlib.sha256(data).hexdigest()
          print('Input tar.xz SHA256',got)
          if got!=expected:raise SystemExit('Artifact SHA256 mismatch')
          with tarfile.open(fileobj=io.BytesIO(data),mode='r:xz') as f:
              f.extractall(path='.',filter='data')
          board=pathlib.Path('rev27_native_drc/RC18_Lite_Rev26_ROUTED_DRAFT.kicad_pcb').read_bytes()
          digest=hashlib.sha256(board).hexdigest()
          print('Fixed PCB SHA256',digest)
          if digest!='710af374fd54fdae40df21c435d10b9e4e489b096224a8441e405cb257613bda':raise SystemExit('PCB hash mismatch')
          PY
      - name: Run native KiCad DRC, log all warnings and unconnected items
        shell: bash
        run: |
          set +e
          kicad-cli pcb drc --format json --severity-all --exit-code-violations \
            -o rev27_native_drc/RC18_Lite_Rev27_OFFICIAL_DRC.json \
            rev27_native_drc/RC18_Lite_Rev26_ROUTED_DRAFT.kicad_pcb \
            2>&1 | tee rev27_native_drc/kicad_drc_console.log
          result=${PIPESTATUS[0]}
          echo "$result" > rev27_native_drc/kicad_drc_exit_code.txt
          python3 - <<'PY'
          import pathlib,json,collections
          p=pathlib.Path('rev27_native_drc/RC18_Lite_Rev27_OFFICIAL_DRC.json')
          if p.exists():
              d=json.loads(p.read_text())
              print('DRC violations',len(d.get('violations',[])),'unconnected',len(d.get('unconnected_items',[])))
              for t,n in collections.Counter(v['type'] for v in d.get('violations',[])).items():print(t,n)
          PY
          exit "$result"
      - name: Upload detailed native DRC results including violations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc18-lite-rev27-official-kicad-drc
          path: |
            rev27_native_drc/*.json
            rev27_native_drc/*.txt
            rev27_native_drc/*.log
          if-no-files-found: warn
