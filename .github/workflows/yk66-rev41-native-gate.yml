name: YK66 Rev41 KiCad Native Gate
on:
  push:
    branches:
      - research/yk66-rev41-kicad-gate-20261023
    paths:
      - .github/workflows/yk66-rev41-native-gate.yml
      - validation/yk66_rev41_inputs.b64
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-kicad:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install KiCad 10
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:kicad/kicad-10.0-releases
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends kicad kicad-symbols kicad-footprints
          kicad-cli version
      - name: Restore exact Rev41 input
        run: |
          test -s validation/yk66_rev41_inputs.b64
          mkdir -p validation/input validation/results
          base64 -d validation/yk66_rev41_inputs.b64 | tee validation/input_payload.tar.xz | tar -xJf - -C validation/input
          echo '1a1c8653e7dc2a0f31ce5238b16dbc523fadfd42303a57c8533c288670f372cb  validation/input_payload.tar.xz' | sha256sum -c -
          ls -R validation/input
      - name: Correct malformed schematic hide placement in research generator output
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('validation/input/YK66_Rev41_RESEARCH_ONLY.kicad_sch')
          s=p.read_text()
          fixed,n=re.subn(r'(\(effects \(font \(size [^)]+\)\))\) hide\)',r'\1 hide))',s)
          print('malformed hide fields corrected:',n)
          if n!=34: raise SystemExit('Unexpected source content')
          fixed,notes=re.subn(r'\(text "(.*?)"',lambda m:'(text "'+m.group(1).replace('\n',r'\n')+'"',fixed,flags=re.S)
          print('multiline schematic note escaped:',notes)
          if notes!=1: raise SystemExit('Unexpected schematic note')
          p.write_text(fixed)
          PY
      - name: Match PCB net names to hierarchical schematic net names
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('validation/input/YK66_Rev41_RESEARCH_ONLY.kicad_pcb')
          data=p.read_text()
          names=['AC_A','FUSED','C_HOT','N','BLEED_M1','BLEED_M2','LED_R1MID','LED_A']
          counts={}
          for name in names:
              pat=r'(\\(net\\s+\\d+\\s+")'+name+r'("\\))'
              data,n=re.subn(pat,lambda m:m.group(1)+'/'+name+m.group(2),data)
              counts[name]=n
              if n<2: raise SystemExit(f'Unexpected net mapping: {name} {n}')
          p.write_text(data)
          print('PCB net hierarchy normalization:',counts)
          PY
      - name: Native ERC
        shell: bash
        run: |
          set +e
          kicad-cli sch erc -o validation/results/erc.txt validation/input/YK66_Rev41_RESEARCH_ONLY.kicad_sch
          echo $? > validation/results/erc_exit.txt
          cat validation/results/erc.txt
          exit 0
      - name: Native DRC
        shell: bash
        run: |
          set +e
          kicad-cli pcb drc --all-track-errors -o validation/results/drc.txt validation/input/YK66_Rev41_RESEARCH_ONLY.kicad_pcb
          echo $? > validation/results/drc_exit.txt
          cat validation/results/drc.txt
          exit 0
      - name: Export netlist
        shell: bash
        run: |
          kicad-cli sch export netlist --output validation/results/netlist.net validation/input/YK66_Rev41_RESEARCH_ONLY.kicad_sch || true
      - name: Native schematic-to-PCB parity
        shell: bash
        run: |
          set +e
          kicad-cli pcb drc --schematic-parity --severity-all --all-track-errors -o validation/results/parity.txt validation/input/YK66_Rev41_RESEARCH_ONLY.kicad_pcb
          echo $? > validation/results/parity_exit.txt
          cat validation/results/parity.txt
          exit 0
      - name: Preserve official reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yk66-rev41-native-gate
          path: |
            validation/results/
            validation/input/YK66_Rev41_RESEARCH_ONLY.kicad_sch
            validation/input/YK66_Rev41_RESEARCH_ONLY.kicad_pcb
          retention-days: 30
      - name: Strict verification gate
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('validation/results')
          erc=(p/'erc.txt').read_text() if (p/'erc.txt').exists() else ''
          drc=(p/'drc.txt').read_text() if (p/'drc.txt').exists() else ''
          parity=(p/'parity.txt').read_text() if (p/'parity.txt').exists() else ''
          def extract(pattern,s): 
              m=re.search(pattern,s)
              return int(m.group(1)) if m else -1
          ec=extract(r'ERC messages: (\d+)',erc)
          dc=extract(r'Found (\d+) DRC violations',drc)
          pc=extract(r'Found (\d+) DRC violations',parity)
          print('STRICT GATE: ERC issues=',ec,'DRC issues=',dc,'parity DRC issues=',pc)
          if ec!=0 or dc!=0 or pc!=0: raise SystemExit('RESEARCH HOLD: not 0/0/0')
          PY
