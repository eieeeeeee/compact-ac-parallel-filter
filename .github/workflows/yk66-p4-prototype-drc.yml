name: YK66 P4 Prototype PCB DRC
# Re-run P4 verification on branch push (2026-10-27)
on:
  push:
    branches:
      - research/yk66-rev45u-standard-fab-20261024
    paths:
      - .github/workflows/yk66-p4-prototype-drc.yml
      - validation/YK66_Rev45U_P4_UserEdit_FIXED_50x32.kicad_pcb
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prototype-pcb-drc:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install KiCad 10
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:kicad/kicad-10.0-releases
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends kicad
          kicad-cli version
      - name: Prepare exact P4 board
        run: |
          mkdir -p output/reports output/plots
          cp validation/YK66_Rev45U_P4_UserEdit_FIXED_50x32.kicad_pcb output/YK66_Rev45U_P4_UserEdit_FIXED_50x32.kicad_pcb
          printf '{}\n' > output/YK66_Rev45U_P4_UserEdit_FIXED_50x32.kicad_pro
          sha256sum output/*.kicad_pcb | tee output/reports/board_sha256.txt
      - name: Register exact board footprint library
        run: |
          set -e
          /usr/bin/python3 - <<'PY'
          from pathlib import Path
          import pcbnew
          base = Path("output")
          board = pcbnew.LoadBoard(str(base / "YK66_Rev45U_P4_UserEdit_FIXED_50x32.kicad_pcb"))
          lib = base / "YK66.pretty"
          lib.mkdir(exist_ok=True)
          io = pcbnew.PCB_IO_KICAD_SEXPR()
          saved = set()
          for fp in board.GetFootprints():
              name = str(fp.GetFPID().GetLibItemName())
              if name in saved:
                  continue
              io.FootprintSave(str(lib.resolve()), fp)
              saved.add(name)
          if len(list(lib.glob("*.kicad_mod"))) != len(saved):
              raise RuntimeError("Footprint library export incomplete")
          (base / "fp-lib-table").write_text(
              '(fp_lib_table\n  (version 7)\n  (lib (name "YK66")(type "KiCad")(uri "${KIPRJMOD}/YK66.pretty")(options "")(descr "Exact P4 board footprints"))\n)\n'
          )
          print("Registered", len(saved), "unique footprints for", len(list(board.GetFootprints())), "parts")
          PY
      - name: Run native KiCad PCB DRC
        id: drc
        continue-on-error: true
        run: |
          set +e
          kicad-cli pcb drc --severity-all --all-track-errors -o output/reports/native_drc.txt output/YK66_Rev45U_P4_UserEdit_FIXED_50x32.kicad_pcb
          result=$?
          echo "$result" > output/reports/native_drc_exit.txt
          if [ -f output/reports/native_drc.txt ]; then cat output/reports/native_drc.txt; fi
          exit "$result"
      - name: Export preliminary prototype Gerbers and drill
        id: plots
        continue-on-error: true
        run: |
          set -e
          PCB=output/YK66_Rev45U_P4_UserEdit_FIXED_50x32.kicad_pcb
          kicad-cli pcb export gerbers --output output/plots/ --layers F.Cu,B.Cu,F.Mask,B.Mask,F.Silkscreen,B.Silkscreen,Edge.Cuts "$PCB"
          kicad-cli pcb export drill --output output/plots/ --format excellon --excellon-units mm "$PCB"
      - name: Write explicit acceptance memo with scope
        if: always()
        run: |
          /usr/bin/python3 - <<'PY'
          from pathlib import Path
          import os
          import re
          p = Path("output/reports")
          p.mkdir(parents=True, exist_ok=True)
          report = (p / "native_drc.txt").read_text(errors="replace") if (p / "native_drc.txt").exists() else ""
          m = re.search(r"Found (\d+) DRC violations", report)
          n = re.search(r"Found (\d+) unconnected pads", report)
          f = re.search(r"Found (\d+) Footprint errors", report)
          drc_ok = (p / "native_drc_exit.txt").exists() and (p / "native_drc_exit.txt").read_text().strip() == "0" and all(x is not None and x.group(1) == "0" for x in (m, n, f))
          gerber_ok = os.environ.get("PLOTS_OUTCOME") == "success"
          manufacturing_status = "合格（KiCad DRC・Gerber/ドリル生成の範囲）" if drc_ok and gerber_ok else "不合格／未完了"
          memo = f"""# YK66 Rev45U P4 50x32mm 検証・合格判定メモ

          基板製造データ検証: {manufacturing_status}
          判定基準: KiCad DRC違反0件・未接続0件・フットプリントエラー0件、Gerber/Excellon出力成功。
          DRC違反: {m.group(1) if m else '未確認'}件
          未接続: {n.group(1) if n else '未確認'}件
          フットプリントエラー: {f.group(1) if f else '未確認'}件
          Gerber/Excellon出力: {os.environ.get('PLOTS_OUTCOME', '未確認')}

          AC100V絶縁審査: 未判定（合格とは記載しない）
          異ネット間の最小銅箔間隔: 未測定／数値未確定
          適用安全規格・過電圧カテゴリ・汚損度・材料CTI・必要空間距離・沿面距離: 未確定
          表裏層の重なり、端子台・部品下の沿面経路、筐体内の導電部との距離も別途評価が必要。
          DRCの無効化項目は本メモの合格対象外。

          このメモは上記の判定範囲だけに適用する。AC100V製品の安全適合や発注承認を意味しない。
          絶縁条件の根拠と最小実測値が確定し、基準を満たした場合のみ、別途「AC100V絶縁審査: 合格（基準・測定値・証拠を明記）」を追記する。
          """
          (p / "ACCEPTANCE_MEMO_JA.md").write_text("\n".join(line.strip() for line in memo.splitlines()) + "\n", encoding="utf-8")
          print((p / "ACCEPTANCE_MEMO_JA.md").read_text())
          PY
        env:
          PLOTS_OUTCOME: ${{ steps.plots.outcome }}
      - name: Upload PCB and reports even on errors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: YK66-P4-Prototype-Native-DRC
          path: output/
          retention-days: 30
      - name: Report actual prototype validation status
        if: always()
        run: |
          echo 'Prototype PCB DRC only; this workflow does not certify AC100V product safety.'
          test -f output/reports/native_drc_exit.txt
          test "$(cat output/reports/native_drc_exit.txt)" = "0"
          test "${{ steps.plots.outcome }}" = "success"
