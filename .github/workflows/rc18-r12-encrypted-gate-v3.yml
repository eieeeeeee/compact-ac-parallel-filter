name: RC18 R1.2 Encrypted Native Gate V3

on:
  push:
    branches:
      - rc18-r12-native-gate-20261007
    paths:
      - '.github/workflows/rc18-r12-encrypted-gate-v3.yml'

permissions:
  contents: read

jobs:
  native-gate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4

      - name: Generate ephemeral RSA gate key
        run: |
          set -euxo pipefail
          mkdir -p /tmp/rc18_gate
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out /tmp/rc18_gate/private.pem
          openssl pkey -in /tmp/rc18_gate/private.pem -pubout -out /tmp/rc18_gate/public.pem
          printf '%s\n' "${GITHUB_RUN_ID}" > /tmp/rc18_gate/run_id.txt

      - name: Upload public key
        uses: actions/upload-artifact@v4
        with:
          name: rc18-gate-public-key-${{ github.run_id }}
          path: |
            /tmp/rc18_gate/public.pem
            /tmp/rc18_gate/run_id.txt
          if-no-files-found: error

      - name: Install exact KiCad 10.0.6
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:kicad/kicad-10.0-releases
          sudo apt-get update
          sudo apt-get install -y kicad
          kicad-cli --version | tee KICAD_NATIVE_VERSION.txt
          test "$(kicad-cli --version | awk '{print $1}')" = "10.0.6"

      - name: Wait for encrypted payload chunks
        run: |
          set -euxo pipefail
          mkdir -p encrypted
          base="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}/rc18-gate/${GITHUB_RUN_ID}"
          found=0
          for i in $(seq 1 300); do
            ok=1
            for n in 00 01 02 03 04 05; do
              curl -fsSL "${base}/payload.part${n}" -o "encrypted/payload.part${n}" || ok=0
            done
            curl -fsSL "${base}/wrapped_key.bin" -o encrypted/wrapped_key.bin || ok=0
            curl -fsSL "${base}/iv.bin" -o encrypted/iv.bin || ok=0
            if [ "$ok" = "1" ]; then
              found=1
              break
            fi
            rm -f encrypted/payload.part* encrypted/wrapped_key.bin encrypted/iv.bin
            sleep 3
          done
          test "$found" = "1"
          cat encrypted/payload.part00 encrypted/payload.part01 encrypted/payload.part02 encrypted/payload.part03 encrypted/payload.part04 encrypted/payload.part05 > encrypted/payload.enc

      - name: Decrypt and verify exact R1.2 input
        run: |
          set -euxo pipefail
          openssl pkeyutl -decrypt -inkey /tmp/rc18_gate/private.pem             -in encrypted/wrapped_key.bin -out /tmp/rc18_gate/aes.key             -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          KEYHEX="$(od -An -tx1 -v /tmp/rc18_gate/aes.key | tr -d ' \n')"
          IVHEX="$(od -An -tx1 -v encrypted/iv.bin | tr -d ' \n')"
          openssl enc -d -aes-256-cbc -K "$KEYHEX" -iv "$IVHEX"             -in encrypted/payload.enc -out RC18_P21_R1_2_ONECLICK_NATIVE_GATE.zip
          echo "1ed2c089e5215a25951c1d3705362149d53d61359ddd677baeac04ca187c9238  RC18_P21_R1_2_ONECLICK_NATIVE_GATE.zip" | sha256sum -c -

      - name: Run exact Native R1.2 gate
        run: |
          set -euxo pipefail
          rm -rf gate
          mkdir gate
          unzip -q RC18_P21_R1_2_ONECLICK_NATIVE_GATE.zip -d gate
          cd gate/RC18_P21_R1_1_RELEASE
          rm -rf R1_2_NATIVE_RESULTS
          python3 - <<'PY'
          from pathlib import Path
          p=Path('run_r1_2_native_gate.py')
          s=p.read_text(encoding='utf-8')
          old="subprocess.run([exe,'version'], text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)"
          new="subprocess.run([exe,'--version'], text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)"
          if old not in s:
              raise SystemExit('Expected version-call line not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          python3 run_r1_2_native_gate.py

      - name: Collect Native evidence
        if: always()
        run: |
          set -euxo pipefail
          mkdir -p collected
          cp -f KICAD_NATIVE_VERSION.txt collected/ 2>/dev/null || true
          cp -rf gate/RC18_P21_R1_1_RELEASE/R1_2_NATIVE_RESULTS collected/ 2>/dev/null || true
          cp -f gate/RC18_P21_MANUFACTURING_MASTER_R1_2.zip collected/ 2>/dev/null || true
          cp -f gate/RC18_P21_MANUFACTURING_MASTER_R1_2_SHA256.txt collected/ 2>/dev/null || true
          find collected -maxdepth 4 -type f -print

      - name: Upload Native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc18-r12-native-gate-evidence-${{ github.run_id }}
          path: collected/
          if-no-files-found: error
