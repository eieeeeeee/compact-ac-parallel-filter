name: YK66 Rev45U Standard PCB Revised-Annular Gate
on:
  push:
    branches: [research/yk66-rev45u-standard-fab-20261024]
    paths: [.github/workflows/yk66-rev45-routed.yml]
permissions:
  contents: read
jobs:
  native-kicad:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install KiCad 10
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:kicad/kicad-10.0-releases
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends kicad kicad-symbols kicad-footprints
          kicad-cli version
      - name: Restore Rev41
        run: |
          mkdir -p verify/src verify/results
          base64 -d validation/yk66_rev41_inputs.b64 | tar -xJf - -C verify/src
      - name: Generate routed 50x32 RESEARCH ONLY PCB
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,uuid
          p=Path('verify/src/YK66_Rev41_RESEARCH_ONLY.kicad_pcb')
          s=p.read_text()
          for name in ['AC_A','FUSED','C_HOT','N','BLEED_M1','BLEED_M2','LED_R1MID','LED_A']:
              s=s.replace('"'+name+'"','"/'+name+'"')
          # Rev41 archive omitted soldermask/paste from PCB layer table; the first
          # export lacked F.Mask/B.Mask. Explicitly restore standard KiCad layers.
          s=s.replace('(36 "B.SilkS" user) (37 "F.SilkS" user) (44 "Edge.Cuts" user)',
                      '(34 "B.Paste" user) (35 "F.Paste" user) (36 "B.SilkS" user) (37 "F.SilkS" user) (38 "B.Mask" user) (39 "F.Mask" user) (44 "Edge.Cuts" user)')
          assert '(38 "B.Mask" user) (39 "F.Mask" user)' in s
          s=s.replace('(gr_rect (start 0 0) (end 52 42)','(gr_rect (start 0 0) (end 50 32)')
          s=s.replace('YK66 REV41 NOT FOR MAINS / NOT FOR FAB','YK66 Rev45 ROUTED RESEARCH HOLD / NO MAINS')
          # Preserve reference identifiers and pad net assignments.
          xy={'J1':(44,18.6),'F1':(31,27.65),'TCO1':(11.4,15.5),
            'C1':(28,7.1),'MOV1':(26,18.75),
            'RB1':(24,6),'RB2':(33,6),'RB3':(24,14),'RB4':(33,14),
            'RL1':(6,9),'RL2':(6,15),'LED1':(5.7,19),'D1':(5.7,23)}
          for ref,(x,y) in xy.items():
              pattern=r'(\(footprint "[^"]+" \(layer "[^"]+"\) \(uuid [^\)]+\) \(at )([\d.]+) ([\d.]+)( 0\)\n\(property "Reference" "'+ref+r'"\s+)'
              s,n=re.subn(pattern,lambda m:m.group(1)+str(x)+' '+str(y)+m.group(4),s)
              assert n==1,(ref,n)
          # Remove stale copper (Rev41 board was routed at 52x42).
          s,n=re.subn(r'\(segment\s+\(start\s+[^\n]*\n','',s)
          assert n==40,('unexpected original copper count',n)
          st=s.index('(footprint "YK66:TCO_Axial_17p5"')
          en=s.index('\n(footprint ',st+1)
          block=s[st:en].replace('8.750','11.000').replace('(drill 0.900)','(drill 1.250)')
          assert block.count('11.000')==2
          s=s[:st]+block+s[en:]
          s=s.replace('YK66:TCO_Axial_17p5','YK66:TCO_Axial_22p0')
          st=s.index('(footprint "YK66:J_2Pads_5p5"')
          en=s.index('\n(footprint ',st+1)
          def u():return str(uuid.uuid4())
          j=f'''(footprint "YK66:Phoenix_1711725_MKDS3_2_5p08_PRELIM" (layer "F.Cu") (uuid {u()}) (at 44 18.6 0)
          (property "Reference" "J1" (at -6 -6 0) (layer "F.SilkS") (effects (font (size .7 .7) (thickness .12))))
          (property "Value" "PHOENIX_1711725" (at 0 7 0) (layer "F.Fab") (effects (font (size .7 .7) (thickness .12))))
          (attr through_hole)
          (fp_rect (start -5.6 -5.08) (end 5.6 5.08) (stroke (width .12) (type default)) (fill none) (layer "F.Fab") (uuid {u()}))
          (fp_rect (start -5.6 -5.08) (end 5.6 5.08) (stroke (width .05) (type default)) (fill none) (layer "F.CrtYd") (uuid {u()}))
          (pad "1" thru_hole circle (at 0 -2.54) (size 2.4 2.4) (drill 1.3) (layers "*.Cu" "*.Mask") (net 1 "/AC_A") (pinfunction "1") (pintype "passive") (uuid {u()}))
          (pad "2" thru_hole circle (at 0 2.54) (size 2.4 2.4) (drill 1.3) (layers "*.Cu" "*.Mask") (net 4 "/N") (pinfunction "2") (pintype "passive") (uuid {u()}))
          )'''
          s=s[:st]+j+s[en:]
          R={
          1:[(0,[(44,16.06),(47.55,16.06),(47.55,26.2),(46,27.65)])],
          2:[(0,[(16,27.65),(11.4,26.5)]),(0,[(16,27.65),(17,25.9),(19.5,20.1),(22.25,18.75)])],
          3:[(0,[(11.4,4.5),(16.75,7.1)]),(1,[(16.75,7.1),(21,6)]),(1,[(16.75,7.1),(17,10),(18,14),(21,14)]),(1,[(11.4,4.5),(3,4.5),(3,9)])],
          4:[(0,[(44,21.14),(40,21.14),(35,21.14),(29.75,18.75)]),(0,[(29.75,18.75),(34.75,16),(38,12),(39.25,7.1)]),(1,[(39.25,7.1),(36,6)]),(1,[(39.25,7.1),(39.1,11.5),(36,14)]),(1,[(29.75,18.75),(29.75,22.95),(14,22.95),(11,23.2),(7.7,23)]),(1,[(7.7,19),(7.7,23)])],
          5:[(1,[(27,6),(30,6)])],6:[(1,[(27,14),(30,14)])],
          7:[(1,[(9,9),(9.5,11.7),(3,11.7),(3,15)])],
          8:[(1,[(9,15),(5.6,16.7),(3.7,19)]),(1,[(3.7,19),(3.7,23)])]}
          widths={1:.65,2:.65,3:.65,4:.65,5:.45,6:.45,7:.45,8:.4}
          count=0
          copper=[]
          for net,parts in R.items():
              for layer,points in parts:
                  for a,b in zip(points,points[1:]):
                      count+=1
                      copper.append(f'(segment (start {a[0]:.3f} {a[1]:.3f}) (end {b[0]:.3f} {b[1]:.3f}) (width {widths[net]:.3f}) (layer {"F.Cu" if layer==0 else "B.Cu"}) (net {net}) (uuid {u()}))')
          assert count==36,count
          s=s.rstrip()
          assert s[-1]==')'
          s=s[:-1]+'\n'+'\n'.join(copper)+'\n)'
          p.write_text(s)
          print('Research candidate: 50x32, J1 Phoenix 1711725, 26 pads, 36 routed copper segments')
          PY
      - name: Apply clearance improvement candidate ONLY (not manufacturing approval)
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('verify/src/YK66_Rev41_RESEARCH_ONLY.kicad_pcb')
          s=p.read_text()
          assert s.count('47.550')==4
          s=s.replace('47.550','48.550')
          changes={
          '(segment (start 29.750 18.750) (end 29.750 22.950)':'(segment (start 29.750 18.750) (end 29.750 23.600)',
          '(segment (start 29.750 22.950) (end 14.000 22.950)':'(segment (start 29.750 23.600) (end 20.500 23.600)',
          '(segment (start 14.000 22.950) (end 11.000 23.200)':'(segment (start 20.500 23.600) (end 16.500 21.000)',
          '(segment (start 11.000 23.200) (end 7.700 23.000)':'(segment (start 16.500 21.000) (end 7.700 21.000)',
          '(at 5.7 23 0)':'(at 5.0 23 0)',
          }
          for a,b in changes.items():
              assert s.count(a)==1,(a,s.count(a))
              s=s.replace(a,b)
          j0=s.index('(footprint "YK66:Phoenix_1711725_MKDS3_2_5p08_PRELIM"')
          j1=s.index('\n(footprint ',j0+1)
          block=s[j0:j1]
          assert block.count('(size 2.4 2.4)')==2
          block=block.replace('(size 2.4 2.4)','(size 2.05 2.05)')
          s=s[:j0]+block+s[j1:]
          p.write_text(s)
          print('L/N clearance re-route 50x32mm, J1 lands D=2.05mm, diode offset -0.7mm')
          PY
      - name: Restore portable project libraries and apply notation cleanup
        shell: bash
        run: |
          base64 -d validation/yk66_rev45_project_libraries.tar.gz.b64 | tar -xzf - -C verify/src
          python3 validation/yk66_rev45_warning_cleanup.py
          printf '{}\n' > verify/src/YK66_Rev41_RESEARCH_ONLY.kicad_pro
          test -s verify/src/fp-lib-table
          test -s verify/src/sym-lib-table
          ls verify/src/YK66.pretty/*.kicad_mod | wc -l
      - name: Set final J1 manufacturer-specific research geometry
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('verify/src/YK66_Rev41_RESEARCH_ONLY.kicad_pcb')
          s=p.read_text()
          st=s.index('(footprint "YK66:Phoenix_1711725_MKDS3_2_5p08_PRELIM"')
          en=s.index('\n(footprint ',st+1)
          f=s[st:en]
          assert '(at 44 18.6 0)' in f
          f=f.replace('(at 44 18.6 0)','(at 42.4 18.6 0)')
          assert f.count('(start -5.6 -5.08) (end 5.6 5.08)')==2
          f=f.replace('(start -5.6 -5.08) (end 5.6 5.08)','(start -5.9 -5.08) (end 5.3 5.08)')
          assert f.count('thru_hole circle')==2 and f.count('(size 2.05 2.05)')==2
          f=f.replace('thru_hole circle','thru_hole oval').replace('(size 2.05 2.05)','(size 2.50 1.80)')
          s=s[:st]+f+s[en:]
          for a,b in [
            ('(segment (start 44.000 16.060) (end 48.550 16.060)','(segment (start 42.400 16.060) (end 48.550 16.060)'),
            ('(segment (start 44.000 21.140) (end 40.000 21.140)','(segment (start 42.400 21.140) (end 40.000 21.140)')]:
              assert s.count(a)==1,(a,s.count(a))
              s=s.replace(a,b)
          p.write_text(s)
          lib=Path('verify/src/YK66.pretty/Phoenix_1711725_MKDS3_2_5p08_PRELIM.kicad_mod')
          t=lib.read_text()
          assert t.count('(size 2.4 2.4)')==2
          t=t.replace('(size 2.4 2.4)','(size 2.50 1.80)').replace('thru_hole circle','thru_hole oval')
          t=t.replace('start -5.60 -5.08) (end 5.60 5.08','start -5.90 -5.08) (end 5.30 5.08')
          lib.write_text(t)
          print('J1 relocated to 42.4,18.6; 2x 1.3 PTH; copper oval 2.5x1.8; Pin1/L at42.4,16.06; Pin2/N at42.4,21.14')
          print('J1 body right edge 47.7; gap to PCB right edge 2.3mm')
          PY
      - name: Apply J1 high-precision manufacturer-conditional 1.40mm/2.08mm
        shell: bash
        run: |
          python3 validation/yk66_rev45t_J1_1p40_2p08_CANDIDATE.py
      - name: Apply Phoenix 1711725 standard PTH 1.30mm and oval 2.50x1.90mm
        shell: bash
        run: |
          python3 validation/yk66_rev45u_standard_fab_j1.py
      - name: Synchronize full KiCad 10 footprint library to board geometry
        shell: bash
        run: |
          python3 validation/yk66_rev45s_sync_fp_source.py
      - name: Load latest user-edited Rev45U P4 FIXED PCB for official verification
        shell: bash
        run: |
          set -e
          cp validation/YK66_Rev45U_P4_UserEdit_FIXED_50x32.kicad_pcb verify/src/YK66_Rev41_RESEARCH_ONLY.kicad_pcb
          echo "Native DRC input: $(sha256sum verify/src/YK66_Rev41_RESEARCH_ONLY.kicad_pcb)"
          grep -q 'YK66 Rev45U USER ROUTING FIXED' verify/src/YK66_Rev41_RESEARCH_ONLY.kicad_pcb
      - name: Native PCB DRC
        shell: bash
        run: |
          set +e
          kicad-cli pcb drc --severity-all --all-track-errors -o verify/results/rev45_drc.txt verify/src/YK66_Rev41_RESEARCH_ONLY.kicad_pcb
          echo $? > verify/results/drc_exit.txt
          cat verify/results/rev45_drc.txt
          exit 0
      - name: Correct source schematic fields (research only)
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('verify/src/YK66_Rev41_RESEARCH_ONLY.kicad_sch')
          s=p.read_text()
          s,n=re.subn(r'(\(effects \(font \(size [^)]+\)\))\) hide\)',r'\1 hide))',s)
          print('Source malformed field corrections:',n)
          assert n==34,n
          s,n=re.subn(r'\(text "(.*?)"',lambda m:'(text "'+m.group(1).replace('\n',r'\n')+'"',s,flags=re.S)
          print('Source multiline schematic annotation correction:',n)
          assert n==1,n
          s=s.replace('PLUG_INTERFACE_PROVISIONAL','PHOENIX_1711725')
          s=s.replace('YK66:J_2Pads_5p5','YK66:Phoenix_1711725_MKDS3_2_5p08_PRELIM')
          s=s.replace('YK66:TCO_Axial_17p5','YK66:TCO_Axial_22p0')
          p.write_text(s)
          PY
      - name: Official native schematic ERC
        shell: bash
        run: |
          set +e
          kicad-cli sch erc -o verify/results/rev45_erc.txt verify/src/YK66_Rev41_RESEARCH_ONLY.kicad_sch
          echo $? > verify/results/erc_exit.txt
          cat verify/results/rev45_erc.txt
          exit 0
      - name: Official native schematic-to-PCB parity
        shell: bash
        run: |
          set +e
          kicad-cli pcb drc --schematic-parity --severity-all --all-track-errors -o verify/results/rev45_parity.txt verify/src/YK66_Rev41_RESEARCH_ONLY.kicad_pcb
          echo $? > verify/results/parity_exit.txt
          cat verify/results/rev45_parity.txt
          exit 0
      - name: Experimental 3mm L-N isolation screening (NOT safety standard)
        shell: bash
        run: |
          cat > verify/src/YK66_Rev41_RESEARCH_ONLY.kicad_dru <<'RULE'
          (version 1)
          (rule "L-to-N_3mm_screening"
            (severity error)
            (condition "(A.NetName == '/N' && (B.NetName == '/AC_A' || B.NetName == '/FUSED' || B.NetName == '/C_HOT')) || (B.NetName == '/N' && (A.NetName == '/AC_A' || A.NetName == '/FUSED' || A.NetName == '/C_HOT'))")
            (constraint clearance (min 3mm)))
          (rule "Board_edge_1mm_screening"
            (severity error)
            (constraint edge_clearance (min 1mm)))
          RULE
          printf '{}\n' > verify/src/YK66_Rev41_RESEARCH_ONLY.kicad_pro
          set +e
          kicad-cli pcb drc --severity-all --all-track-errors -o verify/results/rev45_3mm_screening_DRC.txt verify/src/YK66_Rev41_RESEARCH_ONLY.kicad_pcb
          echo $? > verify/results/strict_drc_exit.txt
          head -70 verify/results/rev45_3mm_screening_DRC.txt
          exit 0
      - name: Verify custom clearance rules are actually enforced (3.5mm negative control)
        shell: bash
        run: |
          set -e
          cp verify/src/YK66_Rev41_RESEARCH_ONLY.kicad_dru verify/src/rules_3mm_saved.bak
          sed -i 's/(min 3mm)/(min 3.5mm)/g' verify/src/YK66_Rev41_RESEARCH_ONLY.kicad_dru
          set +e
          kicad-cli pcb drc --severity-all --all-track-errors -o verify/results/experimental_3p5mm_negative_control.txt verify/src/YK66_Rev41_RESEARCH_ONLY.kicad_pcb
          echo $? > verify/results/negative_control_exit.txt
          set -e
          cat verify/results/experimental_3p5mm_negative_control.txt | head -35
          mv verify/src/rules_3mm_saved.bak verify/src/YK66_Rev41_RESEARCH_ONLY.kicad_dru
          echo 'Interpretation: if no electrical clearance errors despite known 3.2mm features, project-specific rules may not have been loaded. Do NOT claim IEC approval.'
      - name: Export official KiCad preliminary manufacturing plots
        shell: bash
        run: |
          set -e
          mkdir -p verify/manufacturing
          PCB=verify/src/YK66_Rev41_RESEARCH_ONLY.kicad_pcb
          kicad-cli pcb export gerbers --output verify/manufacturing/ \
            --layers F.Cu,B.Cu,F.Mask,B.Mask,F.Silkscreen,B.Silkscreen,Edge.Cuts "$PCB"
          kicad-cli pcb export drill --output verify/manufacturing/ \
            --format excellon --excellon-units mm "$PCB"
          kicad-cli pcb export pos --side both --format csv --units mm \
            --output verify/manufacturing/Rev45_placements.csv "$PCB"
          ls -al verify/manufacturing
      - name: Preserve native reports and source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: YK66-Rev45-Routed-ResearchOnly-KiCad10-DRC
          path: |
            verify/src/YK66_Rev41_RESEARCH_ONLY.kicad_pcb
            verify/src/YK66_Rev41_RESEARCH_ONLY.kicad_sch
            verify/results/
            verify/manufacturing/
          retention-days: 30
      - name: Mandatory unreleased safety hold
        if: always()
        run: |
          echo 'HOLD: neither EMC nor thermal cutoff function, electrical clearance, assembly, enclosure nor PSE verified.'
          exit 1
