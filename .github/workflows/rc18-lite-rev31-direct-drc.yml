name: RC18 Lite Rev31 Direct 1uF Native KiCad 10 DRC
on:
  push:
    branches: [rc18-lite-rev31-1uf-direct-20261023]
    paths:
      - 'rev31_native_drc/**'
      - '.github/workflows/rc18-lite-rev31-direct-drc.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pcb-drc:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install KiCad 10 CLI
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends software-properties-common
          sudo add-apt-repository -y ppa:kicad/kicad-10.0-releases
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends kicad
          kicad-cli version
      - name: Restore fixed Rev27 source board and custom footprint library
        run: |
          python3 - <<'PY'
          import tarfile,base64,io,pathlib
          src=pathlib.Path('rev27_native_drc/rc18_rev27_input.tar.xz.b64')
          with tarfile.open(fileobj=io.BytesIO(base64.b64decode(src.read_text().strip())),mode='r:xz') as f:
              f.extractall('.',filter='data')
          print('Rev27 restored',pathlib.Path('rev27_native_drc/RC18_Lite_Rev26_ROUTED_DRAFT.kicad_pcb').exists())
          PY
      - name: Convert to Rev31 true direct 1uF and verify byte equality
        run: python3 rev31_native_drc/convert_rev27_to_direct.py
      - name: Official KiCad DRC
        shell: bash
        run: |
          set +e
          kicad-cli pcb drc --format json --severity-all --exit-code-violations \
            -o rev31_native_drc/REV31_OFFICIAL_KICAD_DRC.json \
            rev31_native_drc/RC18_Lite_Rev31_DIRECT_1uF_DRC_CANDIDATE.kicad_pcb \
            2>&1 | tee rev31_native_drc/kicad_drc.log
          ec=${PIPESTATUS[0]}
          echo "$ec" > rev31_native_drc/drc_exit_code.txt
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('rev31_native_drc/REV31_OFFICIAL_KICAD_DRC.json')
          if p.exists():
              o=json.loads(p.read_text())
              print('OFFICIAL REV31 DRC VIOLATIONS:',len(o.get('violations',[])))
              print('OFFICIAL REV31 UNCONNECTED:',len(o.get('unconnected_items',[])))
              print('VIOLATION TYPES:',[x.get('type') for x in o.get('violations',[])])
              print('IGNORED CHECKS:',o.get('ignored_checks',[]))
          PY
          exit "$ec"
      - name: Upload PCB, footprints and official DRC evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RC18_Lite_Rev31_1uF_Direct_Official_DRC
          path: |
            rev31_native_drc/*.kicad_pcb
            rev31_native_drc/*.json
            rev31_native_drc/*.log
            rev31_native_drc/*.txt
            rev31_native_drc/fp-lib-table
            rev31_native_drc/RC18_R26.pretty/*.kicad_mod
          if-no-files-found: warn
