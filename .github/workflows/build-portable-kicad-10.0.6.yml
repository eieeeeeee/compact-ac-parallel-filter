name: Build Portable KiCad 10.0.6 CLI Bundle

on:
  push:
    branches:
      - rc18-r12-native-gate-20261007
    paths:
      - '.github/workflows/build-portable-kicad-10.0.6.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Install exact KiCad 10.0.6
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y software-properties-common pax-utils
          sudo add-apt-repository -y ppa:kicad/kicad-10.0-releases
          sudo apt-get update
          sudo apt-get install -y kicad
          kicad-cli --version
          test "$(kicad-cli --version | awk '{print $1}')" = "10.0.6"

      - name: Build slim self-contained chroot bundle
        run: |
          set -euxo pipefail
          ROOT="$PWD/kicad-root"
          mkdir -p "$ROOT"/{usr/bin,usr/share,etc,tmp,root,lib,lib64,usr/lib}
          cp -a /usr/bin/kicad-cli "$ROOT/usr/bin/"

          copy_dep() {
            local f="$1"
            [ -e "$f" ] || return 0
            mkdir -p "$ROOT$(dirname "$f")"
            cp -aL "$f" "$ROOT$f"
          }

          while IFS= read -r f; do copy_dep "$f"; done < <(lddtree -l /usr/bin/kicad-cli | sort -u)

          # KiCad runtime modules, but NOT symbol/footprint/3D/template libraries.
          for d in /usr/lib/x86_64-linux-gnu/kicad /usr/lib/kicad /usr/lib/x86_64-linux-gnu/wx; do
            if [ -d "$d" ]; then
              mkdir -p "$ROOT$d"
              cp -a "$d"/. "$ROOT$d"/
              while IFS= read -r so; do
                while IFS= read -r dep; do copy_dep "$dep"; done < <(lddtree -l "$so" 2>/dev/null | sort -u || true)
              done < <(find "$d" -type f \( -name '*.so' -o -name '*.so.*' \))
            fi
          done

          # Copy only resources owned by the main kicad package.
          dpkg -L kicad | while read -r p; do
            case "$p" in
              /usr/share/kicad/footprints/*|/usr/share/kicad/symbols/*|/usr/share/kicad/3dmodels/*|/usr/share/kicad/template/*|/usr/share/doc/*)
                continue
                ;;
            esac
            if [ -f "$p" ]; then
              mkdir -p "$ROOT$(dirname "$p")"
              cp -aL "$p" "$ROOT$p"
            elif [ -d "$p" ]; then
              mkdir -p "$ROOT$p"
            fi
          done

          # Minimal font/config support.
          mkdir -p "$ROOT/usr/share/fonts/truetype/dejavu" "$ROOT/etc"
          cp -a /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf "$ROOT/usr/share/fonts/truetype/dejavu/" 2>/dev/null || true
          cp -a /usr/share/fonts/truetype/dejavu/DejaVuSansMono.ttf "$ROOT/usr/share/fonts/truetype/dejavu/" 2>/dev/null || true
          [ -d /etc/fonts ] && cp -a /etc/fonts "$ROOT/etc/"
          [ -f /etc/nsswitch.conf ] && cp -a /etc/nsswitch.conf "$ROOT/etc/"
          printf '10.0.6\n' > "$ROOT/KICAD_EXPECTED_VERSION.txt"

      - name: Prove and self-repair bundle in isolated chroot
        run: |
          set -euxo pipefail
          ROOT="$PWD/kicad-root"

          copy_runtime_lib() {
            local lib="$1"
            local p
            p="$(ldconfig -p | awk -v lib="$lib" '$1==lib {print $NF; exit}')"
            if [ -z "$p" ] || [ ! -e "$p" ]; then
              echo "Unable to locate missing runtime library: $lib" >&2
              return 1
            fi
            mkdir -p "$ROOT$(dirname "$p")"
            cp -aL "$p" "$ROOT$p"
            echo "Added runtime library: $lib <- $p"
          }

          run_with_repair() {
            local out rc lib
            for attempt in $(seq 1 40); do
              set +e
              out="$(sudo chroot "$ROOT" "$@" 2>&1)"
              rc=$?
              set -e
              if [ "$rc" -eq 0 ]; then
                printf '%s\n' "$out"
                return 0
              fi
              lib="$(printf '%s\n' "$out" | sed -n 's/.*error while loading shared libraries: \([^:]*\):.*/\1/p' | head -n1)"
              if [ -z "$lib" ]; then
                printf '%s\n' "$out" >&2
                return "$rc"
              fi
              copy_runtime_lib "$lib"
            done
            echo "Exceeded runtime dependency repair attempts" >&2
            return 99
          }

          run_with_repair /usr/bin/kicad-cli --version | tee portable-version.txt
          grep -q '^10.0.6' portable-version.txt
          run_with_repair /usr/bin/kicad-cli sch erc --help > portable-erc-help.txt
          run_with_repair /usr/bin/kicad-cli pcb drc --help > portable-drc-help.txt
          grep -q -- '--exit-code-violations' portable-erc-help.txt
          grep -q -- '--schematic-parity' portable-drc-help.txt

      - name: Package portable bundle
        run: |
          set -euxo pipefail
          ROOT="$PWD/kicad-root"
          find "$ROOT" -type f -print0 | sort -z | xargs -0 sha256sum > "$ROOT/SHA256SUMS_PORTABLE.txt"
          sudo tar --numeric-owner -C "$ROOT" -I 'zstd -19 -T0' -cf KICAD_10_0_6_PORTABLE_CHROOT.tar.zst .
          sha256sum KICAD_10_0_6_PORTABLE_CHROOT.tar.zst > KICAD_10_0_6_PORTABLE_CHROOT_SHA256.txt
          du -sh "$ROOT"
          ls -lh KICAD_10_0_6_PORTABLE_CHROOT.tar.zst
          test "$(stat -c %s KICAD_10_0_6_PORTABLE_CHROOT.tar.zst)" -lt 500000000

      - name: Upload portable KiCad artifact
        uses: actions/upload-artifact@v4
        with:
          name: kicad-10.0.6-portable-chroot
          path: |
            KICAD_10_0_6_PORTABLE_CHROOT.tar.zst
            KICAD_10_0_6_PORTABLE_CHROOT_SHA256.txt
            portable-version.txt
            portable-erc-help.txt
            portable-drc-help.txt
          compression-level: 0
          if-no-files-found: error
