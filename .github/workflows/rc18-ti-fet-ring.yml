name: RC18 TI FET ringing sweep
on:
  push:
    branches: [rc18-r2-3-1c-native-gate]
    paths: ['.github/workflows/rc18-ti-fet-ring.yml']
jobs:
  ring:
    runs-on: ubuntu-latest
    steps:
      - name: Install ngspice and download TI FET model
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ngspice
          echo 'set ngbehavior=ps' > ~/.spiceinit
          curl -fL --retry 4 -o csd.zip https://www.ti.com/lit/zip/SLPM073
          unzip -q csd.zip
          python3 - <<'PY'
          from pathlib import Path
          p=Path("CSD17381F4.lib")
          s=p.read_text(encoding="latin-1")
          repl={
            "{pWidth}":"0.1217604",
            "{pLen}":"0.5u",
            "{perim}":"0.25569684",
            "{abc /10}":"1.1e-12",
            "{abc }":"1.1e-11",
            "TC1={ptrc1}":"TC1=3.00e-3",
            "TC2={ptrc2}":"TC2=1.40e-6",
          }
          for a,b in repl.items(): s=s.replace(a,b)
          p.write_text(s, encoding="latin-1")
          PY
      - name: Sweep power-loop inductance
        shell: bash
        run: |
          set -euo pipefail
          for LN in 2 5 10 15 20; do
            cat > ring_${LN}n.cir <<EOF
          * RC18 commutation ring - TI CSD17381F4 official model, local PSpice params numerically expanded
          .include CSD17381F4.lib
          VBUS pcap 0 13.2
          C605 pcap 0 100n
          C606 pcap 0 1u
          C607 pcap 0 10u
          LPH pcap dh ${LN}n
          XHS dh gh sw csd17381f4
          XLS sw gl 0 csd17381f4
          ILOAD sw 0 DC 0.807
          VGLD gld 0 PWL(0 6.96 50n 6.96 51n 0 150n 0 151n 6.96 220n 6.96)
          RGL gld gl 2.2
          VGHFLOAT ghd sw PWL(0 0 66n 0 67n 6.96 135n 6.96 136n 0 220n 0)
          RGH ghd gh 2.2
          RGPULL gh sw 100k
          RLPULL gl 0 100k
          .ic V(sw)=0 V(gh)=0 V(gl)=6.96
          .options reltol=2e-4 abstol=1e-10 vntol=1e-7 method=gear
          .tran 0.02n 220n 0 0.02n uic
          .meas tran VSWMAX MAX V(sw) FROM=45n TO=210n
          .meas tran VSWMIN MIN V(sw) FROM=45n TO=210n
          .meas tran VDSLSMAX MAX V(sw) FROM=45n TO=210n
          .meas tran VDSHSMAX MAX V(dh,sw) FROM=45n TO=210n
          .end
          EOF
            set +e
            ngspice -b -o ring_${LN}n.log ring_${LN}n.cir
            rc=$?
            set -e
            echo "===== LLOOP=${LN}nH rc=$rc ====="
            cat ring_${LN}n.log
          done
