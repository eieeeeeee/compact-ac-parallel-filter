name: RC18 electrical validation

on:
  push:
    paths:
      - 'simulations/rc18-b2.1/**'
      - 'firmware/rc18-b2.1/**'
      - 'validation/rc18-b2.1/**'
      - 'docs/RC18-B2.1-VALIDATION-SPEC.md'
      - '.github/workflows/rc18-electrical-validation.yml'
  pull_request:
    paths:
      - 'simulations/rc18-b2.1/**'
      - 'firmware/rc18-b2.1/**'
      - 'validation/rc18-b2.1/**'
      - 'docs/RC18-B2.1-VALIDATION-SPEC.md'
      - '.github/workflows/rc18-electrical-validation.yml'
  workflow_dispatch:

jobs:
  electrical-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: simulations/rc18-b2.1/requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install -r simulations/rc18-b2.1/requirements.txt

      - name: Run float32 and Q31 RC18 gate
        run: python simulations/rc18-b2.1/validate_rc18.py

      - name: Show summary
        if: always()
        run: cat validation/rc18-b2.1/generated/summary.csv || true

      - name: Upload numerical results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc18-b2.1-electrical-gate
          path: validation/rc18-b2.1/generated/*.csv
          if-no-files-found: error
