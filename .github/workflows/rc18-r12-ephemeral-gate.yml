name: RC18 R1.2 Ephemeral Encrypted Native Gate

on:
  push:
    branches:
      - rc18-r12-native-gate-20261007
    paths:
      - '.github/workflows/rc18-r12-ephemeral-gate.yml'
      - 'rc18-ephemeral-trigger.txt'

permissions:
  contents: read

jobs:
  native-gate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4

      - name: Generate ephemeral RSA gate key
        run: |
          set -euxo pipefail
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out /tmp/rc18_gate_private.pem
          openssl pkey -in /tmp/rc18_gate_private.pem -pubout -out /tmp/rc18_gate_public.pem
          echo "RC18_GATE_PUBLIC_KEY_B64=$(base64 -w0 /tmp/rc18_gate_public.pem)"

      - name: Install exact KiCad 10.0.6
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:kicad/kicad-10.0-releases
          sudo apt-get update
          sudo apt-get install -y kicad
          kicad-cli --version | tee KICAD_NATIVE_VERSION.txt
          test "$(kicad-cli --version | awk '{print $1}')" = "10.0.6"

      - name: Wait for encrypted RC18 payload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p encrypted
          fetch_raw() {
            local path="$1"
            local out="$2"
            curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github.raw+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${GITHUB_REF_NAME}" \
              -o "${out}"
          }
          found=0
          for i in $(seq 1 120); do
            if fetch_raw "rc18-gate/payload.enc" "encrypted/payload.enc" \
              && fetch_raw "rc18-gate/wrapped_key.bin" "encrypted/wrapped_key.bin" \
              && fetch_raw "rc18-gate/iv.bin" "encrypted/iv.bin"; then
              found=1
              break
            fi
            rm -f encrypted/payload.enc encrypted/wrapped_key.bin encrypted/iv.bin
            sleep 2
          done
          test "$found" = "1"

      - name: Decrypt and verify exact R1.2 input
        run: |
          set -euxo pipefail
          openssl pkeyutl -decrypt \
            -inkey /tmp/rc18_gate_private.pem \
            -in encrypted/wrapped_key.bin \
            -out /tmp/aes.key \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256
          KEYHEX="$(xxd -p -c 64 /tmp/aes.key)"
          IVHEX="$(xxd -p -c 32 encrypted/iv.bin)"
          openssl enc -d -aes-256-cbc -K "$KEYHEX" -iv "$IVHEX" \
            -in encrypted/payload.enc \
            -out RC18_P21_R1_2_ONECLICK_NATIVE_GATE.zip
          echo "1ed2c089e5215a25951c1d3705362149d53d61359ddd677baeac04ca187c9238  RC18_P21_R1_2_ONECLICK_NATIVE_GATE.zip" | sha256sum -c -

      - name: Run exact Native R1.2 gate
        run: |
          set -euxo pipefail
          rm -rf gate
          mkdir gate
          unzip -q RC18_P21_R1_2_ONECLICK_NATIVE_GATE.zip -d gate
          cd gate/RC18_P21_R1_1_RELEASE
          rm -rf R1_2_NATIVE_RESULTS
          python3 - <<'PY'
          from pathlib import Path
          p=Path('run_r1_2_native_gate.py')
          s=p.read_text(encoding='utf-8')
          old="subprocess.run([exe,'version'], text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)"
          new="subprocess.run([exe,'--version'], text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)"
          if old not in s:
              raise SystemExit('Expected version-call line not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          python3 run_r1_2_native_gate.py

      - name: Collect Native evidence
        if: always()
        run: |
          set -euxo pipefail
          mkdir -p collected
          cp -f KICAD_NATIVE_VERSION.txt collected/ 2>/dev/null || true
          cp -rf gate/RC18_P21_R1_1_RELEASE/R1_2_NATIVE_RESULTS collected/ 2>/dev/null || true
          cp -f gate/RC18_P21_MANUFACTURING_MASTER_R1_2.zip collected/ 2>/dev/null || true
          cp -f gate/RC18_P21_MANUFACTURING_MASTER_R1_2_SHA256.txt collected/ 2>/dev/null || true
          find collected -maxdepth 4 -type f -print

      - name: Upload Native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc18-r12-native-gate-evidence
          path: collected/
          if-no-files-found: error
