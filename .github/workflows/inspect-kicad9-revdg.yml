name: Inspect KiCad 9 symbols for Rev.D-G

on:
  push:
    branches: [rev-d-g-v1.2]
    paths:
      - '.github/workflows/inspect-kicad9-revdg.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker pull kicad/kicad:9.0
      - name: Dump STM32G474R base symbol and selected references
        run: |
          mkdir -p inspect-out
          chmod 777 inspect-out
          docker run --rm -v "${{ github.workspace }}:/work" kicad/kicad:9.0 bash -lc '
            set -e
            f=/usr/share/kicad/symbols/MCU_ST_STM32G4.kicad_sym
            line=$(grep -n -m1 "(symbol \"STM32G474R_B-C-E_Tx\"" "$f" | cut -d: -f1)
            echo "BASE_LINE=$line"
            start=$line
            end=$((line+2600))
            sed -n "${start},${end}p" "$f"
          ' | tee inspect-out/stm32g474r-base.txt
      - uses: actions/upload-artifact@v4
        with:
          name: revdg-stm32g474r-base
          path: inspect-out/
