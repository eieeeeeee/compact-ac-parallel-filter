name: Inspect KiCad 9 board rule API

on:
  push:
    branches: [rev-d-g-v1.2]
    paths:
      - '.github/workflows/inspect-kicad9-revdg.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker pull kicad/kicad:9.0
      - name: Inspect board design settings
        run: |
          docker run --rm kicad/kicad:9.0 python3 -c 'import pcbnew; b=pcbnew.BOARD(); d=b.GetDesignSettings(); print([x for x in dir(d) if "clear" in x.lower() or "class" in x.lower() or "track" in x.lower()]); print("default",d.GetDefaultNetClass() if hasattr(d,"GetDefaultNetClass") else "none"); nc=d.GetDefaultNetClass() if hasattr(d,"GetDefaultNetClass") else None; print([x for x in dir(nc) if "clear" in x.lower() or "width" in x.lower()] if nc else "")'
