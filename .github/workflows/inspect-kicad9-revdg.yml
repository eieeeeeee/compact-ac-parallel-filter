name: Inspect KiCad 9 routing interfaces

on:
  push:
    branches: [rev-d-g-v1.2]
    paths:
      - '.github/workflows/inspect-kicad9-revdg.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker pull kicad/kicad:9.0
      - name: Check DSN/SES and pcbnew routing APIs
        run: |
          docker run --rm kicad/kicad:9.0 bash -lc '
            echo "===== kicad-cli pcb help ====="
            kicad-cli pcb --help || true
            echo "===== kicad-cli pcb export help ====="
            kicad-cli pcb export --help || true
            echo "===== pcbnew DSN SES symbols ====="
            python3 - <<PY
            import pcbnew
            for n in dir(pcbnew):
                if any(k in n.lower() for k in ["specctra","dsn","ses","zone_filler","router"]):
                    print(n)
            PY
          '
