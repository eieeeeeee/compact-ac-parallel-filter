name: Inspect KiCad 9 routing interfaces

on:
  push:
    branches: [rev-d-g-v1.2]
    paths:
      - '.github/workflows/inspect-kicad9-revdg.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker pull kicad/kicad:9.0
      - name: Check pcbnew DSN/SES APIs
        run: |
          docker run --rm kicad/kicad:9.0 python3 -c 'import pcbnew; print("VERSION",pcbnew.GetBuildVersion()); [print(n) for n in dir(pcbnew) if any(k in n.lower() for k in ("specctra","dsn","ses"))]'
