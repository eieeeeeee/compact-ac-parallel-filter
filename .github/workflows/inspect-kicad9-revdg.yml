name: Inspect Freerouting Docker CLI

on:
  push:
    branches: [rev-d-g-v1.2]
    paths:
      - '.github/workflows/inspect-kicad9-revdg.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker pull ghcr.io/freerouting/freerouting:latest
      - name: Inspect image
        run: |
          docker inspect ghcr.io/freerouting/freerouting:latest --format 'ENTRYPOINT={{json .Config.Entrypoint}} CMD={{json .Config.Cmd}}'
          docker run --rm --entrypoint /bin/sh ghcr.io/freerouting/freerouting:latest -lc 'echo PATH=$PATH; find / -maxdepth 4 -type f \( -name "*.jar" -o -name "*freerouting*" \) 2>/dev/null | head -50; ls -la /app /opt /freerouting 2>/dev/null || true'
