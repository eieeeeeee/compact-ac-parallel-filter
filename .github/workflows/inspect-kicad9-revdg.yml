name: Inspect KiCad 9 exact remaining footprints

on:
  push:
    branches: [rev-d-g-v1.2]
    paths:
      - '.github/workflows/inspect-kicad9-revdg.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker pull kicad/kicad:9.0
      - name: Search exact remaining footprints
        run: |
          docker run --rm kicad/kicad:9.0 bash -lc '
            echo "===== WUERTH 691253510002 ====="
            find /usr/share/kicad/footprints -type f | grep -Ei "691253510002|691253|Wuerth.*2.*5.08|TerminalBlock_Wuerth" | head -80 || true
            echo "===== C 7.2 x 5.0 P5 ====="
            find /usr/share/kicad/footprints/Capacitor_THT.pretty -type f | grep -Ei "7.2.*5.0.*P5|P5.00.*7.2|L7.2.*W5" | head -50 || true
          '
