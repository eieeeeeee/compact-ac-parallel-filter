name: Inspect KiCad 9 SES import API

on:
  push:
    branches: [rev-d-g-v1.2]
    paths:
      - '.github/workflows/inspect-kicad9-revdg.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker pull kicad/kicad:9.0
      - name: Inspect SES import signature
        run: |
          docker run --rm kicad/kicad:9.0 python3 -c 'import pcbnew, inspect; print(pcbnew.ImportSpecctraSES); print(getattr(pcbnew.ImportSpecctraSES,"__doc__",None)); print(pcbnew.ExportSpecctraDSN); print(getattr(pcbnew.ExportSpecctraDSN,"__doc__",None))'
