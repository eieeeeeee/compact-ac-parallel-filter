name: Inspect KiCad 9 symbols for Rev.D-G

on:
  push:
    branches: [rev-d-g-v1.2]
    paths:
      - '.github/workflows/inspect-kicad9-revdg.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker pull kicad/kicad:9.0
      - name: Search installed KiCad symbols
        run: |
          mkdir -p inspect-out
          chmod 777 inspect-out
          docker run --rm -v "${{ github.workspace }}:/work" kicad/kicad:9.0 bash -lc '
            set -e
            for q in STM32G474RCTx STM32G474RCT6 TLV9062 INA240A1 TLV3202 SN74LVC1G332 LMG2100 TPS62163 TLV75533 G5V-1 2N7002; do
              echo "===== $q ====="
              grep -R -n -m 5 "\"$q\"" /usr/share/kicad/symbols/*.kicad_sym 2>/dev/null || true
              grep -R -n -m 5 "$q" /usr/share/kicad/symbols/*.kicad_sym 2>/dev/null || true
            done
          ' | tee inspect-out/symbol-search.txt
      - uses: actions/upload-artifact@v4
        with:
          name: revdg-kicad9-symbol-search
          path: inspect-out/
