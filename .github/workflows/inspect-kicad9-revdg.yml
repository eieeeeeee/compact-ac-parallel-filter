name: Inspect KiCad 9 footprints for Rev.D-G

on:
  push:
    branches: [rev-d-g-v1.2]
    paths:
      - '.github/workflows/inspect-kicad9-revdg.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker pull kicad/kicad:9.0
      - name: Search installed footprints
        run: |
          docker run --rm kicad/kicad:9.0 bash -lc '
            for p in               "*VSSOP*8*0.65*"               "*WSON*8*2x2*0.5*"               "*SRP7028*"               "*VLF3012*"               "*7.3x7.3*"               "*LMG2100*"               "*VQFN*5.5*4.5*"               "*RAR*" ; do
              echo "===== $p ====="
              find /usr/share/kicad/footprints -type f -name "$p.kicad_mod" -printf "%h/%f\n" 2>/dev/null | head -30
            done
          '
