name: KiCad 10 RC18 Rev.B-SI P2 ERC

on:
  push:
    branches:
      - rc18-revb-si-p2-kicad10-erc
    paths:
      - 'ci/p2-kicad10/**'
      - '.github/workflows/kicad10-rc18-revb-si-p2-erc.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  erc:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct and verify P2 package
        run: |
          set -euxo pipefail
          mkdir -p ci-reports hardware/rc18-revb-si-p2
          cat ci/p2-kicad10/p2-package.b64.part* | base64 -d > /tmp/p2.zip
          echo "b3ca981044bb8607d98d2648eb9bfe2903048b8b03bf23c30fff45204a6adf51  /tmp/p2.zip" | sha256sum -c -
          unzip -q -o /tmp/p2.zip -d hardware/rc18-revb-si-p2
          find hardware/rc18-revb-si-p2/P2_KiCad10_ERC0_Footprint -maxdepth 2 -type f -print | sort
          python ci/p2-kicad10/fix_erc.py hardware/rc18-revb-si-p2/P2_KiCad10_ERC0_Footprint
          chmod 777 ci-reports

      - name: Pull official KiCad 10.0.6 image
        run: docker pull kicad/kicad:10.0.6

      - name: KiCad version
        run: docker run --rm kicad/kicad:10.0.6 kicad-cli --version

      - name: Run official KiCad 10 ERC
        id: erc
        continue-on-error: true
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            -w /work/hardware/rc18-revb-si-p2/P2_KiCad10_ERC0_Footprint \
            kicad/kicad:10.0.6 \
            kicad-cli sch erc \
              --severity-all \
              --exit-code-violations \
              --output /work/ci-reports/rc18-revb-si-p2-kicad10-erc.rpt \
              RC18_RevB_SI.kicad_sch

      - name: Print ERC report
        if: always()
        run: |
          echo "===== KICAD 10 ERC ====="
          test -f ci-reports/rc18-revb-si-p2-kicad10-erc.rpt && cat ci-reports/rc18-revb-si-p2-kicad10-erc.rpt || true
          echo "ERC outcome: ${{ steps.erc.outcome }}"

      - name: Upload P2 and ERC report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc18-revb-si-p2-kicad10-erc
          path: |
            ci-reports/
            hardware/rc18-revb-si-p2/P2_KiCad10_ERC0_Footprint/
          if-no-files-found: warn

      - name: Enforce ERC pass
        if: always()
        run: test "${{ steps.erc.outcome }}" = "success"
