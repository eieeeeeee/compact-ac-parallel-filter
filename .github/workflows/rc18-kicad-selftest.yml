name: RC18 KiCad 10.0.6 Self-Test

on:
  push:
    branches:
      - rc18-r12-native-gate-20261007
    paths:
      - '.github/workflows/rc18-kicad-selftest.yml'
      - 'rc18-selftest-trigger.txt'
  workflow_dispatch:

jobs:
  kicad-selftest:
    runs-on: ubuntu-24.04
    steps:
      - name: Install KiCad 10.0 release PPA
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:kicad/kicad-10.0-releases
          sudo apt-get update
          sudo apt-get install -y kicad

      - name: Verify exact KiCad version
        run: |
          set -euxo pipefail
          kicad-cli --version | tee kicad-version.txt
          VER="$(kicad-cli --version | awk '{print $1}')"
          test "$VER" = "10.0.6"

      - name: Verify native CLI command surfaces
        run: |
          set -euxo pipefail
          kicad-cli sch erc --help > sch-erc-help.txt
          kicad-cli pcb drc --help > pcb-drc-help.txt
          grep -q -- '--exit-code-violations' sch-erc-help.txt
          grep -q -- '--exit-code-violations' pcb-drc-help.txt
          grep -q -- '--schematic-parity' pcb-drc-help.txt
          printf 'SELFTEST_PASS KiCad=%s\n' "$(cat kicad-version.txt)"

      - name: Upload self-test evidence
        uses: actions/upload-artifact@v4
        with:
          name: rc18-kicad-10.0.6-selftest
          path: |
            kicad-version.txt
            sch-erc-help.txt
            pcb-drc-help.txt
